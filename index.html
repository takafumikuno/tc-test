// 時間ジャンプ (欠落跨ぎ・ループ先頭) を滑らかにつなぐためのクロスフェード合成
const FS_COMP = `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uTex;
uniform float uAlpha;
out vec4 oCol;
void main() { oCol = vec4(texture(uTex, vUv).rgb, uAlpha); }`;

const VS_GLOBE = `#version 300 es
layout(location=0) in vec2 aPos;
uniform vec2 uScale;
uniform vec3 uView;   // (中心x, 中心y, ズーム倍率) — ディスク半径=1の座標系
uniform vec2 uRoll;   // 画面回転 (cosθ, sinθ): 画面中心を軸に地球と背景を一緒に回す
out vec2 vPos;
out vec2 vUvFull;
void main() {
  vec2 p = aPos * uScale;                                   // 画面中心基準・等方 (ディスク半径=1)
  vec2 q = vec2(p.x * uRoll.x + p.y * uRoll.y, -p.x * uRoll.y + p.y * uRoll.x);  // R(-θ)·p
  vPos = q / uView.z + uView.xy;
  vUvFull = aPos * 0.5 + 0.5;
  gl_Position = vec4(aPos, 0.0, 1.0);
}`;

const FS_GRAY = `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uSrc;
out vec4 oCol;
void main() {
  vec3 c = texture(uSrc, vUv).rgb;
  oCol = vec4(vec3(dot(c, vec3(0.299, 0.587, 0.114))), 1.0);
}`;

// 照明正規化 (ハイパス): 大きなスケールの明るさ変化 (昼夜境界・太陽反射) を除去し、
// 雲などのテクスチャだけを動き推定の対象にする
const FS_HIGHPASS = `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uGray;
out vec4 oCol;
void main() {
  float fine   = textureLod(uGray, vUv, 0.0).r;
  float coarse = textureLod(uGray, vUv, 3.5).r;  // 約45px相当のぼかし = 照明成分
  oCol = vec4(vec3(clamp(0.5 + (fine - coarse) * 2.0, 0.0, 1.0)), 1.0);
}`;

// Horn–Schunck 1反復 (指定LODで画像勾配を取り、近傍平均フローを補正)
const FS_FLOW = `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uGrayA;
uniform sampler2D uGrayB;
uniform sampler2D uPrev;
uniform float uLod;        // グレースケールピラミッドのLOD
uniform vec2  uFlowTexel;  // フローテクスチャの1px (uv)
uniform float uFirst;      // 1.0なら初期化 (フロー0から)
uniform float uMaxFlow;    // フロー上限 (衛星の撮影間隔に応じて可変)
out vec4 oFlow;
void main() {
  vec2 f = vec2(0.0);
  if (uFirst < 0.5) {
    vec2 t = uFlowTexel;
    f = ( texture(uPrev, vUv + vec2( t.x, 0.0)).xy
        + texture(uPrev, vUv + vec2(-t.x, 0.0)).xy
        + texture(uPrev, vUv + vec2(0.0,  t.y)).xy
        + texture(uPrev, vUv + vec2(0.0, -t.y)).xy ) * 0.25;
  }
  float lodTexel = exp2(uLod) / ${GRAY_SIZE.toFixed(1)};  // このLODでの1pxのuv幅
  float a  = textureLod(uGrayA, vUv, uLod).r;
  vec2 w   = vUv + f;
  float b  = textureLod(uGrayB, w, uLod).r;
  float bx0 = textureLod(uGrayB, w - vec2(lodTexel, 0.0), uLod).r;
  float bx1 = textureLod(uGrayB, w + vec2(lodTexel, 0.0), uLod).r;
  float by0 = textureLod(uGrayB, w - vec2(0.0, lodTexel), uLod).r;
  float by1 = textureLod(uGrayB, w + vec2(0.0, lodTexel), uLod).r;
  vec2 g = vec2(bx1 - bx0, by1 - by0) * 0.5;   // 輝度勾配 (LODピクセル単位)
  float It = b - a;
  // ピクセル単位で更新して uv に戻す
  vec2 fpix = f / lodTexel;
  fpix -= It * g / (0.02 + dot(g, g));
  f = fpix * lodTexel;
  // 発散防止: 実際の雲の移動量に合わせた上限 (MTG:±10px, IODC:±16px @512)
  f = clamp(f, vec2(-uMaxFlow), vec2(uMaxFlow));
  oFlow = vec4(f, 0.0, 1.0);
}`;

// フローの後処理: 平滑化 + 暗部 (夜側・宇宙・データ欠損) での抑制
const FS_FLOW_POST = `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uPrev;    // フロー
uniform sampler2D uGrayA;   // 元の輝度 (暗部判定用)
uniform sampler2D uGrayB;
uniform vec2 uFlowTexel;
uniform float uGate;        // 照明変化ゲートの許容度 (フレーム間隔が長い衛星ほど緩く)
out vec4 oFlow;
void main() {
  vec2 t = uFlowTexel;
  // 3x3テントフィルタで平滑化 (スパイク状の誤推定を除去)
  vec2 f = texture(uPrev, vUv).xy * 4.0;
  f += texture(uPrev, vUv + vec2( t.x, 0.0)).xy * 2.0;
  f += texture(uPrev, vUv + vec2(-t.x, 0.0)).xy * 2.0;
  f += texture(uPrev, vUv + vec2(0.0,  t.y)).xy * 2.0;
  f += texture(uPrev, vUv + vec2(0.0, -t.y)).xy * 2.0;
  f += texture(uPrev, vUv + vec2( t.x,  t.y)).xy;
  f += texture(uPrev, vUv + vec2( t.x, -t.y)).xy;
  f += texture(uPrev, vUv + vec2(-t.x,  t.y)).xy;
  f += texture(uPrev, vUv + vec2(-t.x, -t.y)).xy;
  f /= 16.0;
  // テクスチャの無い暗部では動きを推定できない → フローを殺してフェードに任せる
  float a = textureLod(uGrayA, vUv, 2.0).r;
  float b = textureLod(uGrayB, vUv, 2.0).r;
  f *= smoothstep(0.02, 0.10, max(a, b));
  // ワープ補償済みの大域輝度照合: 「動き」で説明できる変化 (雲の移動) はフローを保ち、
  // 説明できない変化 (昼夜境界・太陽反射・雲の生成消滅) はフローを殺してフェードに任せる
  float ca = textureLod(uGrayA, vUv, 3.5).r;
  float cb = textureLod(uGrayB, vUv + f, 3.5).r;
  f *= 1.0 - smoothstep(0.08 * uGate, 0.22 * uGate, abs(ca - cb));
  oFlow = vec4(f, 0.0, 1.0);
}`;

const FS_GLOBE = `#version 300 es
precision highp float;
#define STAR_N ${STAR_N}
in vec2 vPos;
in vec2 vUvFull;
uniform sampler2D uStarTex;   // 恒星カタログ (行0: xyz+等級 / 行1: rgb)
uniform float uSkyTan;        // 空カメラの垂直半画角のtan (歪みのない矩形投影)
uniform float uAspect;        // 画面アスペクト比 w/h
uniform vec2 uRoll;           // 画面回転 (cosθ, sinθ) — 地球と同じ回転を背景にも掛ける
uniform float uStarK;         // 角距離→画素の変換係数 (点像を約1pxに保つ)
uniform float uStarGain;      // 恒星の明るさ全体係数
uniform sampler2D uTexA;
uniform sampler2D uTexB;
uniform sampler2D uFlow;
uniform float uMix;
uniform float uFlowOn;
uniform float uFix;
uniform float uPx;        // ディスク半径1.0に対する1画面ピクセル
uniform float uConfRelax; // 信頼度判定の許容度 (フレーム間隔が長い衛星ほど緩く)
// --- トワイライト再構成 (可視光レイヤーのみ) ---
// 衛星画像は低太陽高度で急激に暗転する (製品のカットオフで崖ができる)。
// フレーム時刻の太陽方向 uSunA/uSunB で「画像に写っている照明」を割り戻し、
// 補間時刻の太陽方向 uSunI による連続的な照明で照らし直すことで、
// 空間的にも時間的にも滑らかな昼→夜のグラデーションを合成する。
uniform float uNm;        // 夜側マスク: 太陽高度に従い夜を真っ暗にする (GeoColorの合成夜景を消す)
uniform float uSrcMerc;   // ソースがWebメルカトル図法 (気象庁タイル) のとき1
uniform vec3  uSunA;
uniform vec3  uSunB;
uniform vec3  uSunI;
uniform float uTw;
uniform vec3  uTint;      // 色調 (衛星ごとのR/G/Bゲイン)
uniform float uTexel;     // 取得画像の1画素 (uv)
uniform float uSharp;     // アンシャープマスク強度
uniform float uScanLon;   // BGMスキャン線の経度 (衛星直下点相対, deg)
uniform float uScanShow;  // スキャン線の表示
out vec4 oCol;

const float R = 6371.0;
const float D = 42164.0;
const float BB = ${BBOX_DEG.toFixed(1)};

// IODC色補正: 植生の緑を抑えて暗く、雲 (灰色・シアン) をより白く
vec3 iodcFix(vec3 c) {
  float lum = dot(c, vec3(0.299, 0.587, 0.114));
  float mx = max(c.r, max(c.g, c.b));
  float mn = min(c.r, min(c.g, c.b));
  float sat = mx - mn;
  // 氷雲のシアンかぶり → 白へ
  float cyan = clamp((min(c.g, c.b) - c.r) * 4.0, 0.0, 1.0) * clamp((lum - 0.30) * 3.0, 0.0, 1.0);
  c = mix(c, vec3(mx), cyan * 0.85);
  // 植生 (緑が支配的で明るすぎない領域): 緑を減らし全体を暗い茶緑に
  float veg = clamp((c.g - max(c.r, c.b)) * 5.0, 0.0, 1.0)
            * (1.0 - clamp((lum - 0.55) * 4.0, 0.0, 1.0));
  // 緑を残しつつ青を絞り、マゼンタに転ばない自然な大地の色 (オリーブ〜カーキ) にする
  vec3 vegCol = vec3(c.r * 1.02, c.g * 0.72, c.b * 0.58) * 0.68;
  // 緑の彩度をさらに1段落とす (落ち着いた植生色に)
  float vlum = dot(vegCol, vec3(0.299, 0.587, 0.114));
  vegCol = mix(vegCol, vec3(vlum), 0.35);
  c = mix(c, vegCol, veg * 0.9);
  // 水雲のピンク色かぶりを白へ (SEVIRI natural RGBはNIR1.6のRが強く水雲が桃色に写る)
  // 彩度の高い暖色 (砂漠・大地) は除外して雲だけを対象にする
  lum = dot(c, vec3(0.299, 0.587, 0.114));
  {
    float mx2 = max(c.r, max(c.g, c.b));
    float mn2 = min(c.r, min(c.g, c.b));
    float rEx = c.r - max(c.g, c.b);
    float pinky = clamp(rEx * 9.0, 0.0, 1.0)
                * clamp((lum - 0.40) * 4.0, 0.0, 1.0)
                * (1.0 - clamp((mx2 - mn2 - 0.20) * 7.0, 0.0, 1.0));
    c = mix(c, vec3(lum * 1.04), pinky * 0.95);
  }
  // 雲 (高輝度・低彩度): 輝度を少し下げてディティール (雲頂の凹凸・濃淡) を残す
  lum = dot(c, vec3(0.299, 0.587, 0.114));
  sat = max(c.r, max(c.g, c.b)) - min(c.r, min(c.g, c.b));
  float cloud = clamp((lum - 0.45) * 2.5, 0.0, 1.0) * (1.0 - clamp(sat * 2.8, 0.0, 1.0));
  c = mix(c, c * 0.86, cloud);
  return clamp(c, 0.0, 1.0);
}

vec3 sampleBlend(vec2 uv) {
  vec3 colA0 = texture(uTexA, uv).rgb;
  vec3 colB0 = texture(uTexB, uv).rgb;
  vec3 faded = mix(colA0, colB0, uMix);          // 通常のクロスフェード
  if (uFlowOn < 0.5) return faded;

  vec2 flow = texture(uFlow, uv).xy;
  float mag = length(flow);
  if (mag < 0.0005) return faded;                 // ほぼ静止ならフェードで十分

  // モーション補間: Aを前方へ、Bを後方へワープして合成
  vec3 colAw = texture(uTexA, uv - flow * uMix).rgb;
  vec3 colBw = texture(uTexB, uv + flow * (1.0 - uMix)).rgb;
  vec3 warped = mix(colAw, colBw, uMix);

  // 信頼度: ワープ後のAとBが一致するほどフローが正しい。
  // 不一致 (明暗の変化・オクルージョン・誤推定) はクロスフェードへ滑らかに退避。
  // 完全に信頼できる場合でも1割はフェードを混ぜ、残留アーティファクトを抑える。
  float err = length(colAw - colBw);
  float conf = (1.0 - smoothstep(0.04 * uConfRelax, 0.15 * uConfRelax, err)) * 0.9;
  return mix(faded, warped, conf);
}

// 全体の色調整: 彩度と青みを強め、コントラストを上げる (ひまわり風の深く鮮やかな海)
vec3 grade(vec3 c) {
  float lum = dot(c, vec3(0.299, 0.587, 0.114));
  c = mix(vec3(lum), c, 1.18);            // 彩度アップ 控えめ (無彩色の雲は白いまま)
  // 陸地 (雲でも海でも夜でもない領域): 彩度を少し落とし、青成分を少し上げる
  {
    float lum1 = dot(c, vec3(0.299, 0.587, 0.114));
    float mx1 = max(c.r, max(c.g, c.b));
    float mn1 = min(c.r, min(c.g, c.b));
    float cloudM = clamp((lum1 - 0.45) * 3.0, 0.0, 1.0) * (1.0 - clamp((mx1 - mn1) * 3.5, 0.0, 1.0));
    float oceanM = clamp((c.b - max(c.r, c.g)) * 3.0, 0.0, 1.0);
    float landM = clamp(1.0 - cloudM - oceanM, 0.0, 1.0) * smoothstep(0.05, 0.18, lum1);
    c = mix(c, mix(vec3(lum1), c, 0.78), landM);       // 陸地の彩度 -22%
    c.b = min(c.b * (1.0 + 0.12 * landM), 1.0);        // 陸地の青 +12%
  }
  // 色調 (衛星ごとのR/G/Bゲイン): ただし明るい無彩色 (雲) はティントから保護する。
  // 保護しないとチャンネルのクリップで雲に色がつく (例: ピンク化)。
  {
    vec3 tinted = c * uTint;
    float mxT = max(c.r, max(c.g, c.b));
    float mnT = min(c.r, min(c.g, c.b));
    float protectW = clamp((dot(c, vec3(0.299, 0.587, 0.114)) - 0.45) * 4.0, 0.0, 1.0)
                   * (1.0 - clamp((mxT - mnT) * 3.0, 0.0, 1.0));
    c = mix(tinted, c, protectW);
  }
  // コントラスト: 暗部では弱める (昼夜境界の立ち下がりを急峻にしないため)
  float l2 = dot(c, vec3(0.299, 0.587, 0.114));
  float k = mix(1.06, 1.20, smoothstep(0.04, 0.30, l2));
  c = (c - 0.5) * k + 0.5;
  // 海 (青が支配的な領域) を明るく鮮やかなロイヤルブルーに (ひまわり真色合成の見え方を参考)
  float ocean = clamp((c.b - max(c.r, c.g)) * 3.0, 0.0, 1.0);
  vec3 sea = vec3(c.r * 0.55 + 0.02, c.g * 1.30 + 0.06, min(c.b * 1.90 + 0.06, 1.0));
  c = mix(c, sea, ocean * 0.7);
  // 雲の完全白色化: 明るく彩度の低い領域は残った色被りを取り除き、混じり気のない白へ
  {
    float lum3 = dot(c, vec3(0.299, 0.587, 0.114));
    float mx3 = max(c.r, max(c.g, c.b));
    float mn3 = min(c.r, min(c.g, c.b));
    float cw = clamp((lum3 - 0.5) * 3.0, 0.0, 1.0) * (1.0 - clamp((mx3 - mn3) * 4.0, 0.0, 1.0));
    c = mix(c, vec3(lum3), cw * 0.92);
  }
  return clamp(c, 0.0, 1.0);
}

// ============ 星空背景 ============
// 衛星の位置 (経度) と表示中の時刻から恒星時を計算し、その瞬間に衛星の背後に
// 実際に見えているはずの天球を手続き的に描く。恒星は天球に固定され、
// 地球の自転 (=表示時刻の進行) に合わせて滑らかに回転する
uniform float uStars;     // 星空背景 ON/OFF
uniform float uCosT;      // 恒星時角 θ = GMST + 衛星経度 の cos/sin
uniform float uSinT;

float hash13(vec3 p) {
  p = fract(p * 0.1031);
  p += dot(p, p.zyx + 31.32);
  return fract((p.x + p.y) * p.z);
}
vec3 hash33(vec3 p) {
  p = fract(p * vec3(0.1031, 0.1030, 0.0973));
  p += dot(p, p.yxz + 33.33);
  return fract((p.xxy + p.yxx) * p.zyx);
}
float vnoise3(vec3 p) {
  vec3 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(
    mix(mix(hash13(i), hash13(i + vec3(1, 0, 0)), f.x),
        mix(hash13(i + vec3(0, 1, 0)), hash13(i + vec3(1, 1, 0)), f.x), f.y),
    mix(mix(hash13(i + vec3(0, 0, 1)), hash13(i + vec3(1, 0, 1)), f.x),
        mix(hash13(i + vec3(0, 1, 1)), hash13(i + vec3(1, 1, 1)), f.x), f.y), f.z);
}
float fbm(vec3 p) {
  // オクターブごとに座標を回転させ、値ノイズの格子由来の「モザイク」を消す
  const mat3 M = mat3(0.00, 0.80, 0.60, -0.80, 0.36, -0.48, -0.60, -0.48, 0.64);
  float v = 0.0, a = 0.5;
  for (int i = 0; i < 6; i++) { v += a * vnoise3(p); p = M * p * 2.0 + 7.3; a *= 0.5; }
  return v;
}
// 恒星のレイヤー: 方向ベクトル空間の3Dセルに星を1つずつ置く。
// dens=発光する星の割合 (小さいほど密), bloom>0 で輝星に淡いにじみを足す
vec3 starLayer(vec3 sc, float scale, float gain, float sharp, float dens, float bloom) {
  vec3 p = sc * scale;
  vec3 base = floor(p - 0.5);
  vec3 col = vec3(0.0);
  for (int ix = 0; ix < 2; ix++)
  for (int iy = 0; iy < 2; iy++)
  for (int iz = 0; iz < 2; iz++) {
    vec3 c = base + vec3(float(ix), float(iy), float(iz));
    float h = hash13(c + 7.7);
    if (h < 1.0 - dens) continue;                     // 大半のセルは空 (密度制御)
    vec3 rnd = hash33(c);
    float d = length(p - (c + 0.15 + rnd * 0.7));
    float hn = (h - (1.0 - dens)) / dens;             // 0..1 に正規化
    float mag = pow(hn, 4.5) + step(0.985, h) * 0.8;  // 等級分布 + 僅かな輝星
    // 星の色: 青白 (高温) 〜 橙 (低温) を実際の恒星のように散らす
    vec3 tint = mix(vec3(1.0, 0.86, 0.72), vec3(0.70, 0.82, 1.0), hash13(c + 3.3));
    float core = exp(-d * d * sharp);
    float glow = bloom * pow(hn, 10.0) * exp(-d * d * sharp * 0.28); // 輝星の小さなにじみ (控えめ)
    col += mag * gain * (core + glow) * tint;
  }
  return col;
}
vec3 starField(vec3 dir) {
  // 描画系 → 天球座標 (X=春分点, Z=天の北極) へ恒星時角で変換
  vec3 sc = normalize(vec3(
    -dir.x * uSinT + dir.z * uCosT,
     dir.x * uCosT + dir.z * uSinT,
     dir.y));
  // 銀河座標: 天の川の帯は銀河面 (銀河北極 RA192.86° Dec27.13°) に沿う
  float sinB = dot(sc, vec3(-0.8682, -0.1981, 0.4560));            // 銀緯のsin
  float toC  = max(dot(sc, vec3(-0.0549, -0.8734, -0.4839)), 0.0); // 銀河中心方向 (いて座)
  float band  = exp(-pow(sinB / 0.20, 2.0));                       // 広い主帯
  float core  = exp(-pow(sinB / 0.085, 2.0));                      // 細い明るい芯
  float bulge = 0.5 + 1.4 * toC * toC * toC;                       // 中心バルジで明るく

  // 天の川の淡い地光 (unresolved light): なめらかな多重オクターブ。輝度は控えめにし、
  // 見た目の「粒状感」は下の無数の微光星で作る (本物の天の川と同じ構成)
  float neb = fbm(sc * 5.0);
  neb = neb * neb;                                                 // コントラストを付けて塊を締める
  float rift = 1.0 - 0.7 * smoothstep(0.5, 0.9, fbm(sc * 8.0 + 20.0))
                    * exp(-pow(sinB / 0.10, 2.0)) * (0.4 + 0.6 * toC); // 暗黒帯
  float glowAmt = band * bulge * (0.15 + 0.85 * neb) * rift;
  vec3 mwCol = mix(vec3(0.55, 0.62, 0.80), vec3(0.85, 0.78, 0.70), toC * 0.5);
  vec3 mw = mwCol * glowAmt * 0.11;                                // ごく淡い地光 (輝度を大きく抑制)
  mw += mwCol * core * bulge * rift * 0.06;                        // 芯のうっすらした明るみ
  mw = max(mw, vec3(0.0));

  // 点光源 (実在恒星カタログ + 微光星の絨毯) を一旦 stars に合算し、最後にトーンマップで
  // 上限圧縮する。これにより「突出した大きい/明るい白点」が原理的に生じず、全天が均一な
  // 微細粒の星野になる (大きい星の排除)。
  vec3 stars = vec3(0.0);
  // 実在の恒星 (カタログ): 位置・スペクトル色で描く。等級差はごく僅かな輝度差のみで表現し、
  // 芯は全星共通の極小点。突出させない。
  for (int i = 0; i < STAR_N; i++) {
    vec4 sd = texelFetch(uStarTex, ivec2(i, 0), 0);   // xyz, 等級
    // 【中抜けの丸の根本原因】カタログのベクトルがごく僅かに単位長を超える(最大1.0000064)
    // ものがあり、巨大な uStarK と相まって中心付近で 1-dt が負になり exp(-pk) が発散、
    // 広範囲が飽和して平坦な円盤(中抜けに見える丸)になっていた。ベクトルを正規化して
    // dt<=1 を保証し、pk を 0 以上にクランプして発散を断つ → 全星が極小の点になる。
    float dt = dot(sc, normalize(sd.xyz));
    if (dt <= 0.0) continue;
    float amp = pow(2.512, -sd.w) * uStarGain;         // 等級→強度 (Pogsonの式)
    float pk = max(0.0, 2.0 * (1.0 - dt) * uStarK * 2.6); // 芯の減衰 (0未満に発散させない)
    if (pk > 40.0) continue;                            // 近傍画素のみ寄与
    float lum = 0.70 - 0.44 * exp(-amp * 1.1);          // 等級差はごく僅かな輝度差のみ (点は極小)
    vec3 scol = texelFetch(uStarTex, ivec2(i, 1), 0).rgb;
    stars += scol * lum * exp(-pk);                     // 全星共通の極小点
  }
  // 微光星の絨毯 = 天の川の粒状感の正体。銀河面へ向かうほど密になり、無数の極小点が
  // 「ざらついた光の帯」に見える (実際の天の川と同じ)
  float db = 0.25 + band * 2.4;                                    // 帯で星密度が急増
  stars += starLayer(sc,          150.0, 0.42, 100.0, min(1.0, 0.35 * db), 0.0);
  stars += starLayer(sc + 27.3,  300.0, 0.34,  28.0, min(1.0, 0.5 * db),  0.0);
  stars += starLayer(sc + 51.9,  560.0, 0.26,   9.0, min(1.0, 0.7 * db),  0.0);
  stars += starLayer(sc + 73.1, 1000.0, 0.18,   3.0, min(1.0, 0.85 * db), 0.0);
  // トーンマップ (上限 ~0.6): どんなに明るい/重なった点でも突出した白点にならない
  stars = stars / (1.0 + 1.1 * stars);
  return mw + stars;
}

void main() {
  float r = length(vPos);
  float rho = asin(R / D);
  float tr  = tan(rho);
  vec3 dir  = normalize(vec3(vPos.x * tr, vPos.y * tr, -1.0));
  float bq  = D * dir.z;
  float disc = bq * bq - (D * D - R * R);
  // 背景: 星空ON時は実際の天球、OFF時は純黒
  if (r >= 1.0 || disc < 0.0) {
    vec3 bg = vec3(0.0);
    if (uStars > 0.5) {
      // 歪みのない矩形カメラ (ディスクの投影とは独立) で空を張る。
      // 画角(uSkyTan)を制御することで、広角でも自然な星野になる (以前の歪み解消)
      vec2 ndc = vUvFull * 2.0 - 1.0;
      vec2 sp = vec2(ndc.x * uAspect, ndc.y);                 // 等方な画面座標
      vec2 sq = vec2(sp.x * uRoll.x + sp.y * uRoll.y, -sp.x * uRoll.y + sp.y * uRoll.x);  // 地球と同じ回転
      vec3 skyDir = normalize(vec3(sq.x * uSkyTan, sq.y * uSkyTan, -1.0));
      bg = starField(skyDir);
      float rr = length(ndc);
      bg *= 1.0 - 0.28 * smoothstep(0.75, 1.5, rr);  // 周辺減光 (写真のような四隅の暗さ)
      bg += vec3(0.012, 0.016, 0.030);               // ごく淡い夜天光のベース
    }
    oCol = vec4(bg, 1.0);
    return;
  }
  float t = -bq - sqrt(disc);
  vec3 P = vec3(t * dir.x, t * dir.y, D + t * dir.z);

  float lat = degrees(asin(clamp(P.y / R, -1.0, 1.0)));
  float lon = degrees(atan(P.x, P.z));
  vec2 uv = vec2((lon + BB) / (2.0 * BB), (BB - lat) / (2.0 * BB));
  if (uSrcMerc > 0.5) {
    // メルカトルソース: 縦方向のみ非線形 (±81.5°のメルカトルY = ±2.599478)
    float m = log(tan(radians(45.0 + lat * 0.5)));
    uv.y = (2.599478 - m) / (2.0 * 2.599478);
  }

  vec3 col = sampleBlend(uv);

  // アンシャープマスク: 近傍4点の平均との差を増幅して精細感を上げる
  if (uSharp > 0.0) {
    vec3 blur = ( sampleBlend(uv + vec2( uTexel, 0.0))
                + sampleBlend(uv + vec2(-uTexel, 0.0))
                + sampleBlend(uv + vec2(0.0,  uTexel))
                + sampleBlend(uv + vec2(0.0, -uTexel)) ) * 0.25;
    col = clamp(col + (col - blur) * uSharp, 0.0, 1.0);
  }

  if (uTw > 0.5) {
    vec3 un = P / R;   // 地表単位ベクトル (太陽高度: sinE = dot(un, sunDir))
    float illA = pow(clamp(dot(un, uSunA), 0.0, 1.0), 0.7);
    float illB = pow(clamp(dot(un, uSunB), 0.0, 1.0), 0.7);
    float illS = mix(illA, illB, uMix);        // 元画像に写っている (段階的な) 照明
    float sinE = dot(un, uSunI);               // いまの補間時刻の連続的な太陽高度
    // 照明の割り戻し → 連続照明で再点灯。窓は製品カットオフの崖を外に置く。
    // 乗数は1.0を上限にクランプ:「暗くする」方向にしか作用しないため、
    // モデル誤差があっても昼側の縁が周囲より明るく浮くことは原理的に起きない。
    float gain = min(1.0 / max(illS, 0.02), 3.5);
    float illT = pow(clamp(sinE, 0.0, 1.0), 0.7) * smoothstep(0.02, 0.30, sinE);
    col *= min(gain * illT, 1.0);
  }

  if (uNm > 0.5) {
    // 夜側マスク: 実際の太陽高度に従って夜側をなだらかに暗転させ、
    // 昼→夜が自然な薄明のグラデーションで真っ暗に落ちるようにする
    vec3 un = P / R;
    float sinE = dot(un, uSunI);
    col *= smoothstep(-0.12, 0.10, sinE);
  }

  if (uFix > 0.5) col = iodcFix(col);
  col = grade(col);

  // BGMスキャン線: 走査中の画素の輝度・色相をリアルタイムに反映する波形表示。
  // 明るい場所ほど線が東へ尖り、シャープに強く光り、色はその画素の色相を帯びる。
  if (uScanShow > 0.5) {
    vec2 uvS = vec2((uScanLon + BB) / (2.0 * BB), uv.y);   // この緯度の走査点
    vec3 sCol = mix(texture(uTexA, uvS).rgb, texture(uTexB, uvS).rgb, uMix);
    float sLum = dot(sCol, vec3(0.299, 0.587, 0.114));
    float defl = (sLum - 0.12) * 3.4;                       // 輝度で東へ尖る (deg)
    float d = lon - (uScanLon + defl);
    float sharp = mix(4.0, 18.0, sLum);                     // 明るいほど鋭く
    float glow = exp(-d * d * sharp);
    vec3 hueCol = normalize(sCol + vec3(0.02)) * 1.25;      // 走査画素の色相
    vec3 lineCol = mix(vec3(0.25, 0.75, 1.0), hueCol, 0.55);
    col += lineCol * glow * (0.30 + sLum * 0.65);
  }

  // ディスク縁のアンチエイリアスのみ (発光やリングは描かない)
  col *= smoothstep(1.0, 1.0 - 1.5 * uPx, r);
  oCol = vec4(col, 1.0);
}`;

function compileProgram(vsSrc, fsSrc) {
  const mk = (type, src) => {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  };
  const p = gl.createProgram();
  gl.attachShader(p, mk(gl.VERTEX_SHADER, vsSrc));
  gl.attachShader(p, mk(gl.FRAGMENT_SHADER, fsSrc));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}

function mkTex(w, h, internal, filter, levels) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texStorage2D(gl.TEXTURE_2D, levels || 1, internal, w, h);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER,
    levels && levels > 1 ? gl.LINEAR_MIPMAP_LINEAR : filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  return t;
}

function initGL() {
  // 再実行可能にするため、GLリソース参照をリセット
  flowPing = []; flowFBO = []; texPool = [];
  canFlow = false; flowTexKey = ""; flowResult = null;
  // preserveDrawingBuffer: 直前フレームを保持し、時間ジャンプ時のクロスフェード用に
  // 前の画面を正しくスナップショットできるようにする (毎フレーム全画素を描くので残像はない)
  gl = canvas.getContext("webgl2", { antialias: true, alpha: false, preserveDrawingBuffer: true });
  if (!gl) return "none";
  try {
    progGlobe    = compileProgram(VS_GLOBE, FS_GLOBE);
    progGray     = compileProgram(VS_QUAD, FS_GRAY);
    progHP       = compileProgram(VS_QUAD, FS_HIGHPASS);
    progFlow     = compileProgram(VS_QUAD, FS_FLOW);
    progFlowPost = compileProgram(VS_QUAD, FS_FLOW_POST);
    progComp     = compileProgram(VS_QUAD, FS_COMP);

    quadVAO = gl.createVertexArray();
    gl.bindVertexArray(quadVAO);
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

    const uni = (p, names) => { const o = {}; for (const n of names) o[n] = gl.getUniformLocation(p, n); return o; };
    locGlobe = uni(progGlobe, ["uScale","uTexA","uTexB","uFlow","uMix","uFlowOn","uFix","uPx","uView","uConfRelax","uSunA","uSunB","uSunI","uTw","uNm","uSrcMerc","uStars","uCosT","uSinT","uStarTex","uSkyTan","uAspect","uStarK","uStarGain","uTint","uTexel","uSharp","uScanLon","uScanShow","uRoll"]);
    locGray  = uni(progGray,  ["uSrc"]);
    locFlow  = uni(progFlow,  ["uGrayA","uGrayB","uPrev","uLod","uFlowTexel","uFirst","uMaxFlow"]);
    locFlowPost = uni(progFlowPost, ["uPrev","uGrayA","uGrayB","uFlowTexel","uGate"]);
    locHP = uni(progHP, ["uGray"]);
    locComp = uni(progComp, ["uTex", "uAlpha"]);

    // フロー用リソース (floatレンダリング対応をチェック)
    canFlow = !!gl.getExtension("EXT_color_buffer_float");
    if (canFlow) {
      const levels = Math.log2(GRAY_SIZE) + 1;
      grayTexA = mkTex(GRAY_SIZE, GRAY_SIZE, gl.R8, gl.LINEAR, levels);
      grayTexB = mkTex(GRAY_SIZE, GRAY_SIZE, gl.R8, gl.LINEAR, levels);
      hpTexA   = mkTex(GRAY_SIZE, GRAY_SIZE, gl.R8, gl.LINEAR, levels);
      hpTexB   = mkTex(GRAY_SIZE, GRAY_SIZE, gl.R8, gl.LINEAR, levels);
      grayFBO  = gl.createFramebuffer();
      for (let i = 0; i < 2; i++) {
        flowPing.push(mkTex(FLOW_SIZE, FLOW_SIZE, gl.RGBA16F, gl.LINEAR, 1));
        flowFBO.push(gl.createFramebuffer());
        gl.bindFramebuffer(gl.FRAMEBUFFER, flowFBO[i]);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, flowPing[i], 0);
      }
      if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) canFlow = false;
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    }
    // フロー無効時に使うゼロフロー (1x1黒 RGBA8)
    zeroFlowTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, zeroFlowTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0,0,0,255]));
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);

    // 恒星カタログのデータテクスチャ (幅=星数, 高さ2: 行0=xyz+等級, 行1=rgb)
    starTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, starTex);
    const sd = new Float32Array(STAR_N * 2 * 4);
    for (let i = 0; i < STAR_N; i++) {
      const b = BRIGHT_STARS[i];
      sd[i * 4 + 0] = b[0]; sd[i * 4 + 1] = b[1]; sd[i * 4 + 2] = b[2]; sd[i * 4 + 3] = b[3]; // xyz, mag
      const o = (STAR_N + i) * 4;
      sd[o + 0] = b[4]; sd[o + 1] = b[5]; sd[o + 2] = b[6]; sd[o + 3] = 1.0;                 // rgb
    }
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, STAR_N, 2, 0, gl.RGBA, gl.FLOAT, sd);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

    // クロスフェード用スナップショット (ジャンプ直前の画面をコピーして重ねる)
    snapTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, snapTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0, 0, 0, 255]));
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    fadeActive = false; fadeAlpha = 0;

    // フレームテクスチャプール
    texPool = [{ tex: null, key: 0 }, { tex: null, key: 0 }, { tex: null, key: 0 }];
  } catch (e) {
    gl = null;
    return "fail";
  }
  attachContextLossHandlers();
  return "ok";
}

// bitmapを (必要なら確保して) プールのテクスチャへアップロード
function uploadFrameTex(slot, bm, key) {
  if (!slot.tex) {
    slot.tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, slot.tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  } else {
    gl.bindTexture(gl.TEXTURE_2D, slot.tex);
  }
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB8, gl.RGB, gl.UNSIGNED_BYTE, bm);
  slot.key = key;
}
function ensureFrameTex(f, keepKeys) {
  let slot = texPool.find((s) => s.key === f.t);
  if (slot) return slot.tex;
  const bm = ensureBitmap(f);
  if (!bm) return null;
  // 現在のペアで使用中のテクスチャは追い出さない (ループ先頭に戻るときに重要)
  const evictable = texPool.filter((s) => !keepKeys.includes(s.key));
  slot = evictable.find((s) => !s.key) || evictable[0] || texPool[0];
  uploadFrameTex(slot, bm, f.t);
  return slot.tex;
}

// ペア (fa→fb) のオプティカルフローを計算 (結果はflowResultに)
function computeFlow(texA, texB, key) {
  if (flowTexKey === key) return;
  gl.bindVertexArray(quadVAO);
  gl.viewport(0, 0, GRAY_SIZE, GRAY_SIZE);
  gl.bindFramebuffer(gl.FRAMEBUFFER, grayFBO);
  // 1) グレースケール化 + ミップ生成
  gl.useProgram(progGray);
  gl.uniform1i(locGray.uSrc, 0);
  gl.activeTexture(gl.TEXTURE0);
  for (const [src, dst] of [[texA, grayTexA], [texB, grayTexB]]) {
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, dst, 0);
    gl.bindTexture(gl.TEXTURE_2D, src);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    gl.bindTexture(gl.TEXTURE_2D, dst);
    gl.generateMipmap(gl.TEXTURE_2D);
  }
  // 2) 照明正規化 (ハイパス): 昼夜境界や太陽反射などの照明変化を除去
  gl.useProgram(progHP);
  gl.uniform1i(locHP.uGray, 0);
  for (const [src, dst] of [[grayTexA, hpTexA], [grayTexB, hpTexB]]) {
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, dst, 0);
    gl.bindTexture(gl.TEXTURE_2D, src);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    gl.bindTexture(gl.TEXTURE_2D, dst);
    gl.generateMipmap(gl.TEXTURE_2D);
  }
  // 3) コース→ファインで反復 (入力はハイパス済みテクスチャ)
  gl.useProgram(progFlow);
  gl.uniform1i(locFlow.uGrayA, 0);
  gl.uniform1i(locFlow.uGrayB, 1);
  gl.uniform1i(locFlow.uPrev, 2);
  gl.uniform2f(locFlow.uFlowTexel, 1 / FLOW_SIZE, 1 / FLOW_SIZE);
  gl.uniform1f(locFlow.uMaxFlow, 0.02 * (sat().flowScale || 1));
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, hpTexA);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, hpTexB);
  gl.viewport(0, 0, FLOW_SIZE, FLOW_SIZE);
  let src = 0, first = true;
  for (const lod of [4, 3, 2]) {
    gl.uniform1f(locFlow.uLod, lod);
    for (let i = 0; i < 10; i++) {
      const dst = 1 - src;
      gl.bindFramebuffer(gl.FRAMEBUFFER, flowFBO[dst]);
      gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, flowPing[src]);
      gl.uniform1f(locFlow.uFirst, first ? 1.0 : 0.0);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      src = dst; first = false;
    }
  }
  // 4) 後処理: 平滑化 + 暗部抑制 (4パス — フロー場を極めて滑らかに保つ)
  gl.useProgram(progFlowPost);
  gl.uniform1i(locFlowPost.uPrev, 2);
  gl.uniform1i(locFlowPost.uGrayA, 0);
  gl.uniform1i(locFlowPost.uGrayB, 1);
  gl.uniform2f(locFlowPost.uFlowTexel, 1 / FLOW_SIZE, 1 / FLOW_SIZE);
  gl.uniform1f(locFlowPost.uGate, sat().flowScale || 1);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, grayTexA);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, grayTexB);
  for (let i = 0; i < 4; i++) {
    const dst = 1 - src;
    gl.bindFramebuffer(gl.FRAMEBUFFER, flowFBO[dst]);
    gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, flowPing[src]);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    src = dst;
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  flowResult = flowPing[src];
  flowTexKey = key;
}

// ---------------- デコード管理 (blob → ImageBitmap) ----------------
const bmCache = new Map();
const maxBitmapCache = () => (activeSize >= 2048 ? 6 : 12);
function ensureBitmap(f) {
  const c = bmCache.get(f.t);
  if (c) return c.bm || null;
  if (!f.blob) return null;
  const entry = {};
  entry.promise = createImageBitmap(f.blob)
    .then((bm) => { entry.bm = bm; })
    .catch(() => { bmCache.delete(f.t); });
  bmCache.set(f.t, entry);
  return null;
}
function pruneBitmaps(currentT) {
  if (bmCache.size <= maxBitmapCache() + 2) return;
  const keep = new Set();
  const ready = readyFrames();
  const idx = ready.findIndex((f) => f.t === currentT);
  for (let d = -1; d <= maxBitmapCache(); d++) {
    const f = ready[(idx + d + ready.length) % ready.length];
    if (f) keep.add(f.t);
  }
  for (const [t, e] of bmCache) {
    if (!keep.has(t) && e.bm) { e.bm.close(); bmCache.delete(t); }
  }
}

// ---------------- 描画 ----------------
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width  = Math.round(canvas.clientWidth  * dpr);
  canvas.height = Math.round(canvas.clientHeight * dpr);
  if (gl) gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener("resize", resize);

// フレーム時刻の太陽方向ベクトル (シェーダ座標系: X=東, Y=北, Z=衛星直下点方向)
function sunDirAt(tMs) {
  const d = new Date(tMs);
  const yearStart = Date.UTC(d.getUTCFullYear(), 0, 0);
  const N = (tMs - yearStart) / 86400000;                      // 通日
  const B = 2 * Math.PI * (N - 81) / 364;
  const eotMin = 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B); // 均時差 (分)
  const decl = -23.44 * Math.PI / 180 * Math.cos(2 * Math.PI * (N + 10) / 365);   // 赤緯
  const utcH = d.getUTCHours() + d.getUTCMinutes() / 60 + d.getUTCSeconds() / 3600;
  const lonS = (12 - utcH - eotMin / 60) * 15;                 // 太陽直下点経度 (deg)
  const dl = (lonS - sat().lon) * Math.PI / 180;
  return [Math.cos(decl) * Math.sin(dl), Math.sin(decl), Math.cos(decl) * Math.cos(dl)];
}
const layerTw = () => !!(sat().layers[layerSel.value] || sat().layers[sat().defaultLayer]).tw;
const layerNm = () => !!(sat().layers[layerSel.value] || sat().layers[sat().defaultLayer]).nm;
const layerSrc = () => (sat().layers[layerSel.value] || sat().layers[sat().defaultLayer]).src || "";

// =========================================================================
//  BGM: 地球スキャン・ソニフィケーション
//  スキャン線 (経線) が左→右へループ移動し、その経度の画像列を12の緯度バンドに
//  分けて明るさを解析。明るさ (雲・陸) → ペンタトニック音階のパッド音量、
//  列のコントラスト → フィルタの開き (音色の明るさ)、平均輝度 → ベースの厚み、
//  スキャン位置 → ステレオパン。夜の海は静寂に、雲の帯は和音の膨らみになる。
// =========================================================================
let bgmOn = false;
let scanShow = true;
let scanLon = -BBOX_DEG;
let curFa = null;               // 表示中のフレーム (解析用, tickで更新)
let curDispT = 0;               // 表示中の補間時刻 (正午同期スキャン用, tickで更新)

// 表示時刻の「太陽正午の子午線」= 日照域のちょうど真ん中 (ローカル12:00) の経度 (直下点相対)
function noonRelLon(tMs) {
  const d = new Date(tMs);
  const yearStart = Date.UTC(d.getUTCFullYear(), 0, 0);
  const N = (tMs - yearStart) / 86400000;
  const B = 2 * Math.PI * (N - 81) / 364;
  const eotMin = 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);
  const utcH = d.getUTCHours() + d.getUTCMinutes() / 60 + d.getUTCSeconds() / 3600
             + d.getUTCMilliseconds() / 3600000;
  let rel = (12 - utcH - eotMin / 60) * 15 - sat().lon;
  rel = ((rel + 180) % 360 + 360) % 360 - 180;
  return rel;
}
let audioG = null;              // オーディオグラフ一式
let bgmTimer = null;
const SCAN_PERIOD_MS = 24000;   // 1スキャンの長さ
const N_BANDS = 12;
// A2基準のメジャーペンタトニック (上=北=高音)
const SCALE_SEMIS = [26, 24, 21, 19, 16, 14, 12, 9, 7, 4, 2, 0];

const anaCv = document.createElement("canvas");
anaCv.width = 96; anaCv.height = 96;
const anaCtx2 = anaCv.getContext("2d", { willReadFrequently: true });
let anaData = null, anaKey = 0;

function updateAnalysis() {
  const f = curFa;
  if (!f || anaKey === f.t) return;
  const src = (useGL ? ensureBitmap(f) : null) || f.img;
  if (!src) return;
  try {
    anaCtx2.drawImage(src, 0, 0, 96, 96);
    anaData = anaCtx2.getImageData(0, 0, 96, 96).data;
    anaKey = f.t;
  } catch (e) { /* CORSでピクセルが読めない場合は既存データを使い続ける */ }
}

// スキャン経度の画像列 → バンド輝度×12 + 地表分類 (雲/砂漠/海/森/夜)
// 分類は色から: 雲=明るく低彩度 / 海=青優勢 / 緑や濃い茶=森 / 明るい茶=砂漠・岩 / 暗部=夜
const T_NONE = 0, T_CLOUD = 1, T_DESERT = 2, T_OCEAN = 3, T_FOREST = 4;
function sampleColumn(lonDeg) {
  const bands = new Array(N_BANDS).fill(0);
  const bandType = new Array(N_BANDS).fill(T_NONE);
  if (!anaData) {
    const t = performance.now() / 1000;
    for (let i = 0; i < N_BANDS; i++) bands[i] = 0.25 + 0.2 * Math.sin(t * 0.1 + i * 1.7);
    return { bands, bandType, mean: 0.3, contrast: 0.15, vals: [],
             cloudFrac: 0, desertFrac: 0, forestFrac: 0, oceanFrac: 0.3, oceanBright: 0.2 };
  }
  const x = Math.max(0, Math.min(95, Math.round((lonDeg + BBOX_DEG) / (2 * BBOX_DEG) * 95)));
  const y0 = 10, y1 = 86; // ディスク内 (緯度±65°相当) のみ
  const vals = [], types = [];
  let nCloud = 0, nDesert = 0, nForest = 0, nOcean = 0, oceanSum = 0;
  for (let y = y0; y < y1; y++) {
    const i = (y * 96 + x) * 4;
    const r = anaData[i] / 255, g = anaData[i + 1] / 255, b = anaData[i + 2] / 255;
    const lum = 0.299 * r + 0.587 * g + 0.114 * b;
    const sat = Math.max(r, g, b) - Math.min(r, g, b);
    let ty = T_NONE;
    if (lum >= 0.07) {
      if (lum > 0.5 && sat < 0.28) { ty = T_CLOUD; nCloud++; }
      else if (b >= g && b > r * 1.05) { ty = T_OCEAN; nOcean++; oceanSum += lum; }
      else if (lum > 0.10) {
        // 陸: 緑優勢または暗い茶 = 森 / 明るい茶 = 砂漠・砂・岩
        if ((g > r * 0.85 && g > b * 1.05) || lum < 0.30) { ty = T_FOREST; nForest++; }
        else { ty = T_DESERT; nDesert++; }
      }
    }
    vals.push(lum); types.push(ty);
  }
  const N = vals.length;
  let mean = 0;
  for (const v of vals) mean += v;
  mean /= N;
  let varsum = 0;
  for (const v of vals) varsum += (v - mean) * (v - mean);
  const contrast = Math.sqrt(varsum / N);
  const per = N / N_BANDS;
  for (let b = 0; b < N_BANDS; b++) {
    let s = 0, n = 0;
    const cnt = [0, 0, 0, 0, 0];
    for (let j = Math.floor(b * per); j < Math.floor((b + 1) * per); j++) {
      s += vals[j]; n++; cnt[types[j]]++;
    }
    bands[b] = n ? s / n : 0;
    // バンド内の支配的な地表タイプ
    let best = T_NONE, bc = 0;
    for (let ty = 1; ty <= 4; ty++) if (cnt[ty] > bc) { bc = cnt[ty]; best = ty; }
    if (bc >= n * 0.35) bandType[b] = best;
  }
  return {
    bands, bandType, mean, contrast, vals,
    cloudFrac: nCloud / N, desertFrac: nDesert / N, forestFrac: nForest / N,
    oceanFrac: nOcean / N, oceanBright: nOcean ? oceanSum / nOcean : 0,
  };
}

function makeImpulse(ctx, seconds) {
  const len = Math.floor(ctx.sampleRate * seconds);
  const buf = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6);
  }
  return buf;
}

function startBgm() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const master = ctx.createGain(); master.gain.value = 0;
  const panner = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
  const filter = ctx.createBiquadFilter();
  filter.type = "lowpass"; filter.frequency.value = 2200; filter.Q.value = 0.5;
  // 残響: 壮大さと包容力のための広い空間。ただし原音優位のバランスを保ち、
  // 変化を塗りつぶす「ぼわーん」にはしない
  const dry = ctx.createGain(); dry.gain.value = 0.68;
  const conv = ctx.createConvolver(); conv.buffer = makeImpulse(ctx, 2.6);
  const wet = ctx.createGain(); wet.gain.value = 0.44;

  const sum = ctx.createGain();
  sum.connect(filter);
  filter.connect(master);
  const tail = panner || master;
  if (panner) master.connect(panner);
  tail.connect(dry); dry.connect(ctx.destination);
  tail.connect(conv); conv.connect(wet); wet.connect(ctx.destination);

  // === オルゴールの子守唄エンジン ===
  // 土台: 画面の地表に合わせて和音が移ろう柔らかなパッドと深いベース。
  // 和音はルート+5度+オクターブの開いた響き (パワーコード) だけを使うので、
  // ペンタトニックの旋律と原理的に濁らない。音色はサイン波のみで刺激ゼロ
  const padG = ctx.createGain(); padG.gain.value = 0;
  const padOs = [];
  const padW = [1.0, 0.72, 0.5];
  for (let i = 0; i < 3; i++) {
    const o = ctx.createOscillator(); o.type = "sine"; o.frequency.value = [110, 164.81, 220][i];
    const og = ctx.createGain(); og.gain.value = padW[i];
    o.connect(og); og.connect(padG); o.start();
    padOs.push(o);
  }
  padG.connect(sum);
  const bassO = ctx.createOscillator(); bassO.type = "sine"; bassO.frequency.value = 110;
  const bassG = ctx.createGain(); bassG.gain.value = 0;
  bassO.connect(bassG); bassG.connect(sum); bassO.start();

  // 砂の打楽器用ノイズバッファ (連続音には使わない — 短い粒だけ)
  const nlen = ctx.sampleRate * 2;
  const nbuf = ctx.createBuffer(1, nlen, ctx.sampleRate);
  const nd = nbuf.getChannelData(0);
  for (let i = 0; i < nlen; i++) nd[i] = Math.random() * 2 - 1;

  // 大地 = 重く暗い土の低音 (A2主体 + A1のサブ)。茶色 (砂漠・岩) と緑 (森) の
  // 合計にリニアに比例して満ちる。2Hz (デルタ波帯) のゆっくりした唸りを持たせ、
  // 深い低音の脈が眠りを誘うように響く。可聴性のため主音は110Hzに置く
  const lo1 = ctx.createOscillator(); lo1.type = "sine"; lo1.frequency.value = 110;
  const lo1b = ctx.createOscillator(); lo1b.type = "sine"; lo1b.frequency.value = 112; // 2Hzの唸り
  const lo1bg = ctx.createGain(); lo1bg.gain.value = 0.55;
  const lo2 = ctx.createOscillator(); lo2.type = "triangle"; lo2.frequency.value = 55;
  const lo2g = ctx.createGain(); lo2g.gain.value = 0.6;
  const landG = ctx.createGain(); landG.gain.value = 0;
  lo1.connect(landG); lo1b.connect(lo1bg); lo1bg.connect(landG);
  lo2.connect(lo2g); lo2g.connect(landG); landG.connect(sum);
  lo1.start(); lo1b.start(); lo2.start();

  // 夜 = 静寂の底のベース: 真っ暗な部分では夜の静けさのベースがはっきり聞こえる
  // 音量で息づく。可聴性のため主音はA2 (110Hz)、下にA1のサブ。2Hz (デルタ波帯) の
  // ゆっくりした唸りと、約12秒周期の呼吸のような膨らみが眠りを誘う
  const no1 = ctx.createOscillator(); no1.type = "sine"; no1.frequency.value = 110;
  const no1b = ctx.createOscillator(); no1b.type = "sine"; no1b.frequency.value = 112; // 2Hzの唸り
  const no1bg = ctx.createGain(); no1bg.gain.value = 0.5;
  const no2 = ctx.createOscillator(); no2.type = "sine"; no2.frequency.value = 55;
  const no2g = ctx.createGain(); no2g.gain.value = 0.6;
  const no3 = ctx.createOscillator(); no3.type = "sine"; no3.frequency.value = 220; // 可聴性のための静かな上音
  const no3g = ctx.createGain(); no3g.gain.value = 0.30;
  const nightG = ctx.createGain(); nightG.gain.value = 0;
  no1.connect(nightG); no1b.connect(no1bg); no1bg.connect(nightG);
  no2.connect(no2g); no2g.connect(nightG);
  no3.connect(no3g); no3g.connect(nightG); nightG.connect(sum);
  no1.start(); no1b.start(); no2.start(); no3.start();
  const nlfo = ctx.createOscillator(); nlfo.type = "sine"; nlfo.frequency.value = 0.085; // 呼吸周期
  const nightSwell = ctx.createGain(); nightSwell.gain.value = 0;
  nlfo.connect(nightSwell); nightSwell.connect(nightG.gain);
  nlfo.start();

  // 嵐の脈動: 渦巻き雲 (低気圧) の上でだけパッドをゆっくり脈打たせるトレモロ。
  // 深さはスキャン内容 (渦度) のみに比例し、渦がなければ完全に無効
  const slfo = ctx.createOscillator(); slfo.type = "sine"; slfo.frequency.value = 2.3;
  const stormDepth = ctx.createGain(); stormDepth.gain.value = 0;
  slfo.connect(stormDepth); stormDepth.connect(padG.gain);
  slfo.start();

  audioG = { ctx, master, filter, panner, sum, padG, padOs, bassO, bassG,
             landG, nightG, nightSwell,
             stormDepth, noiseBuf: nbuf,
             nextBeat: 0, nextChord: 0, chordName: "",
             lastStorm: 0, boxCount: 0,
             pluckCount: 0, shakerCount: 0, rockCount: 0 };
  master.gain.setTargetAtTime(bgmVol(), ctx.currentTime, 1.2); // フェードイン (音量スライダー準拠)

  bgmTimer = setInterval(bgmUpdate, 90);
}

// 森・木のための丸く温かい木琴 (マリンバ風: 柔らかい立ち上がり、豊かな余韻)
function woodPluck(a, freq, vel) {
  const t = a.ctx.currentTime;
  const o1 = a.ctx.createOscillator(); o1.type = "triangle"; o1.frequency.value = freq;
  const o2 = a.ctx.createOscillator(); o2.type = "sine"; o2.frequency.value = freq * 3;
  const g2 = a.ctx.createGain();
  g2.gain.setValueAtTime(0.08, t);
  g2.gain.exponentialRampToValueAtTime(0.001, t + 0.20);
  const g = a.ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.001, vel), t + 0.010);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.75);
  o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(a.sum);
  o1.start(t); o1.stop(t + 0.85);
  o2.start(t); o2.stop(t + 0.35);
  a.pluckCount++;
}

// オルゴールの一音: 澄んだ基音 + すぐに消える控えめな高次部分音。
// 速い立ち上がりと約2秒の長い余韻が、ポップで懐かしく眠気を誘う響きを作る
function musicBox(a, freq, vel, delay) {
  const t = a.ctx.currentTime + (delay || 0);
  const v = Math.min(0.07, vel);
  const o1 = a.ctx.createOscillator(); o1.type = "sine"; o1.frequency.value = freq;
  const o2 = a.ctx.createOscillator(); o2.type = "sine"; o2.frequency.value = freq * 4;
  const g2 = a.ctx.createGain();
  g2.gain.setValueAtTime(0.06, t);
  g2.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
  const g = a.ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.001, v), t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 2.2);
  o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(a.sum);
  o1.start(t); o1.stop(t + 2.4);
  o2.start(t); o2.stop(t + 0.6);
  a.boxCount++;
}

// 岩 = ごつごつした重い打音: 低い音程が沈み込む岩塊のノックと、岩同士が
// 触れ合う低くこもったこすれ。茶色の大地の重厚さを低域だけで描く
function rockHit(a, freq, vel) {
  const t = a.ctx.currentTime;
  const o = a.ctx.createOscillator(); o.type = "sine";
  o.frequency.setValueAtTime(freq, t);
  o.frequency.exponentialRampToValueAtTime(freq * 0.55, t + 0.10); // 沈み込むピッチ
  const g = a.ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.001, vel), t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
  o.connect(g); g.connect(a.sum);
  o.start(t); o.stop(t + 0.4);
  const src = a.ctx.createBufferSource(); src.buffer = a.noiseBuf;
  src.playbackRate.value = 0.35;                                   // 低く重いこすれ
  const lp = a.ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 500;
  const gn = a.ctx.createGain();
  gn.gain.setValueAtTime(0.0001, t);
  gn.gain.exponentialRampToValueAtTime(Math.max(0.001, vel * 0.7), t + 0.012);
  gn.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
  src.connect(lp); lp.connect(gn); gn.connect(a.sum);
  src.start(t, Math.random() * 1.5); src.stop(t + 0.25);
  a.rockCount = (a.rockCount || 0) + 1;
}

// 砂漠・砂・岩: 乾いた砂のシェイカー + 石を叩くような短いコツ音
function sandHit(a, freq, vel) {
  const t = a.ctx.currentTime;
  // 砂 (ハイパスノイズの短いひと吹き)
  const src = a.ctx.createBufferSource(); src.buffer = a.noiseBuf;
  src.playbackRate.value = 1.0 + Math.random() * 0.4;
  const hp = a.ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 2000; // 刺さらない暗めの砂の粒
  const gn = a.ctx.createGain();
  gn.gain.setValueAtTime(0.0001, t);
  gn.gain.exponentialRampToValueAtTime(Math.max(0.001, vel * 0.5), t + 0.008);
  gn.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);
  src.connect(hp); hp.connect(gn); gn.connect(a.sum);
  src.start(t, Math.random() * 1.5); src.stop(t + 0.2);
  // 岩 (ごく短い木質のコツ)
  const o = a.ctx.createOscillator(); o.type = "triangle"; o.frequency.value = freq;
  const g = a.ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.001, vel), t + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
  o.connect(g); g.connect(a.sum);
  o.start(t); o.stop(t + 0.12);
  a.shakerCount++;
}

function bgmUpdate() {
  if (!audioG) return;
  const a = audioG, t = a.ctx.currentTime;

  // スキャン位置の決定
  //  左→右: 一定周期の等速スイープ
  //  右→左 (正午同期): 表示中の時刻における太陽正午の子午線 (日照域のちょうど真ん中 =
  //  ローカル12:00) に張り付く。タイムラプスの進行に伴い自然に右→左へ移動する。
  let onDisk = true;
  if (dirSel.value === "noon") {
    scanLon = noonRelLon(curDispT || Date.now());
    onDisk = Math.abs(scanLon) <= BBOX_DEG;
  } else {
    scanLon = -BBOX_DEG + ((performance.now() % SCAN_PERIOD_MS) / SCAN_PERIOD_MS) * 2 * BBOX_DEG;
  }
  updateAnalysis();
  const col = onDisk
    ? sampleColumn(scanLon)
    : { bands: new Array(N_BANDS).fill(0), bandType: new Array(N_BANDS).fill(0),
        mean: 0.04, contrast: 0.05, cloudFrac: 0, desertFrac: 0, forestFrac: 0,
        oceanFrac: 0, oceanBright: 0 };
  const { bands, bandType, mean, contrast } = col;

  // スキャンの変化量: 前回ティックとの縦プロファイル差。海岸線・雲の縁・地形の
  // 切り替わりを横切った瞬間に大きくなり、単調な場所では小さくなる
  const prevB = a.prevBands || bands;
  let delta = 0;
  for (let i = 0; i < N_BANDS; i++) delta += Math.abs(bands[i] - prevB[i]);
  delta = Math.min(1, delta * 2.5);
  a.deltaEnv = (a.deltaEnv || 0) * 0.72 + delta * 0.28;   // 短い余韻を持つ変化量エンベロープ

  // 渦巻き雲 (低気圧) の指標: 縦方向に雲と晴れ間が交互に並ぶ縞・渦構造ほど大きい。
  // スキャン線上の内容のみから毎ティック算出する (時間や経度そのものには依存しない)
  let flips = 0, cvar = 0;
  for (let i = 1; i < N_BANDS; i++) {
    if ((bandType[i] === T_CLOUD) !== (bandType[i - 1] === T_CLOUD)) flips++;
    cvar += Math.abs(bands[i] - bands[i - 1]);
  }
  const storm = Math.min(1, (flips / 5) * Math.min(1, cvar * 1.1));
  a.lastStorm = storm;
  a.prevBands = bands.slice();

  // === 地表が選ぶ和音 (子守唄の土台) ===
  // いちばん優勢な地表が和音を決める: 海=A / 雲=E / 砂漠=D / 森=F#m。
  // 和音が変わる瞬間にはハープのような優しいロールが鳴り、パッドとベースは
  // ポルタメントで滑らかに新しい和音へ移ろう
  const CHORDS = {
    ocean:  { name: "A",   root: 110.00, tones: [110.00, 164.81, 220.00] },
    cloud:  { name: "E",   root: 82.41,  tones: [82.41, 123.47, 164.81] },
    desert: { name: "D",   root: 73.42,  tones: [73.42, 110.00, 146.83] },
    forest: { name: "F#m", root: 92.50,  tones: [92.50, 138.59, 185.00] },
  };
  const nowMs0 = performance.now();
  if (nowMs0 >= (a.nextChord || 0)) {
    a.nextChord = nowMs0 + 3400;
    const cand = [["ocean", col.oceanFrac], ["cloud", col.cloudFrac],
                  ["desert", col.desertFrac], ["forest", col.forestFrac]];
    cand.sort((x, y) => y[1] - x[1]);
    const ch = CHORDS[cand[0][0]];
    if (ch && ch.name !== a.chordName && cand[0][1] > 0) {
      a.chordName = ch.name;
      for (let i = 0; i < 3; i++) a.padOs[i].frequency.setTargetAtTime(ch.tones[i], t, 0.25);
      a.bassO.frequency.setTargetAtTime(ch.root, t, 0.25);
      for (let i = 0; i < 3; i++) musicBox(a, ch.tones[i] * 2, 0.018 + mean * 0.02, i * 0.15);
    }
  }
  // パッドとベースの音量は明るさの総量にリニアに比例 (真っ暗 → 無音で夜に譲る)。
  // 子守唄の呼吸のようにゆったり追従する
  const padVol = Math.min(0.15, mean * 0.34 * (1 + storm * 0.4));
  a.padG.gain.setTargetAtTime(padVol, t, 0.5);
  a.bassG.gain.setTargetAtTime(Math.min(0.11, mean * 0.24), t, 0.5);
  a.stormDepth.gain.setTargetAtTime(padVol * storm * 0.6, t, 0.2);
  // トーンは常に丸く、コントラストと渦度で明るさがそっと開く
  a.filter.frequency.setTargetAtTime(900 + contrast * 2600 + storm * 1200, t, 0.4);
  if (a.panner) {
    const pan = Math.max(-1, Math.min(1, scanLon / BBOX_DEG)) * 0.75;
    a.panner.pan.setTargetAtTime(pan, t, 0.2);
  }

  // 大地の声部: 茶色 (砂漠・岩) + 緑 (森) の合計に純粋比例する、しっかり聞こえる
  // 土の低音。陸に入れば低音が明確に満ちる
  const landFrac = col.desertFrac + col.forestFrac;
  const landVol = Math.min(0.30, landFrac * 0.75);
  a.landG.gain.setTargetAtTime(landVol, t, 0.12);

  // 夜の声部: 明るい成分が何もない真っ暗な部分では、夜の静寂のベースが
  // はっきり聞こえる音量で息づき、約12秒周期の呼吸のようにゆっくり膨らむ
  const nightFrac = Math.max(0, 1 - col.cloudFrac - col.desertFrac - col.forestFrac - col.oceanFrac);
  const nightVol = Math.min(0.26, nightFrac * 0.27);
  a.nightG.gain.setTargetAtTime(nightVol, t, 0.4);
  a.nightSwell.gain.setTargetAtTime(nightVol * 0.3, t, 0.5);

  if (!onDisk) return; // ディスク外では打楽器・旋律を鳴らさない (夜のベースのみ)

  // 地表の状態で楽器を弾き分ける (320msごと):
  //   雲 = 呼吸する空気の層 (上の連続声部) / 砂漠・岩 = 乾いた砂と石の音 /
  //   森・木 = 丸く温かい木琴 / 海 = 潮騒とパッドの持続 / 夜 = 静寂
  const nowMs = performance.now();
  if (nowMs >= a.nextBeat) {
    a.nextBeat = nowMs + 800 + Math.random() * 160;  // 約65〜75BPM: 安静時心拍に近いゆったりした拍
    // 砂漠・砂・岩: 鳴る頻度も強さも茶色の量にリニアに比例 (しきい値なし)。
    // 乾いた砂の粒に加え、ごつごつと重い岩の低い打音が茶色の広さに応じて鳴る
    let di = 6, dv = 0;
    for (let i = 0; i < N_BANDS; i++)
      if (bandType[i] === T_DESERT && bands[i] > dv) { dv = bands[i]; di = i; }
    if (Math.random() < col.desertFrac * 3.4)
      sandHit(a, 110 * Math.pow(2, SCALE_SEMIS[di] / 12), Math.min(0.12, 0.025 + col.desertFrac * 0.18 + dv * 0.04));
    if (Math.random() < col.desertFrac * 2.6)
      rockHit(a, 55 * Math.pow(2, SCALE_SEMIS[di] / 12), Math.min(0.17, 0.03 + col.desertFrac * 0.28 + dv * 0.05));
    // 渦巻き雲 = 活発な気象: 遠雷のような低い轟きが渦度に比例して轟く
    if (Math.random() < storm * 1.2)
      rockHit(a, 55, Math.min(0.18, 0.05 + storm * 0.15));
    // 森・木: 鳴る頻度も強さも緑の量にリニアに比例 (しきい値なし)。
    // 緑が広い経度でははっきりと木の音が聞こえる
    if (Math.random() < col.forestFrac * 3.4) {
      let fi = 6, fv = 0;
      for (let i = 0; i < N_BANDS; i++)
        if (bandType[i] === T_FOREST && bands[i] > fv) { fv = bands[i]; fi = i; }
      woodPluck(a, 110 * Math.pow(2, SCALE_SEMIS[fi] / 12), Math.min(0.13, 0.03 + col.forestFrac * 0.20 + fv * 0.04));
    }

    // オルゴールの旋律: いちばん明るいバンドの緯度が音の高さになる (北=高い音)。
    // 明るさが音量、雲の白さが1オクターブ上のきらめきを添え、渦の上では
    // 5度上の合いの手が加わる。すべてペンタトニックなので必ず心地よく響く
    let mi = 0, mv = 0;
    for (let i = 0; i < N_BANDS; i++) {
      const wgt = bands[i] * (0.7 + Math.random() * 0.6);
      if (wgt > mv) { mv = wgt; mi = i; }
    }
    if (bands[mi] > 0.02) {
      const f0 = 220 * Math.pow(2, SCALE_SEMIS[mi] / 12);
      musicBox(a, f0, 0.014 + bands[mi] * 0.05 + a.deltaEnv * 0.02);
      if (Math.random() < col.cloudFrac * 2.5)
        musicBox(a, f0 * 2, 0.006 + col.cloudFrac * 0.03, 0.18 + Math.random() * 0.2);
      if (Math.random() < storm)
        musicBox(a, f0 * 1.5, 0.008 + storm * 0.02, 0.4);
    }
  }
}

function stopBgm() {
  clearInterval(bgmTimer); bgmTimer = null;
  if (!audioG) return;
  const a = audioG; audioG = null;
  a.master.gain.setTargetAtTime(0, a.ctx.currentTime, 0.4);
  setTimeout(() => { try { a.ctx.close(); } catch (e) {} }, 1800);
}

function toggleBgm() {
  bgmOn = !bgmOn;
  bgmBtn.textContent = bgmOn ? "♪ BGM: ON" : "♪ BGM: OFF";
  if (bgmOn) startBgm(); else stopBgm();
}

// BGM音量: スライダー 0〜100% を全体ゲインへリニアに反映
function bgmVol() { return 0.40 * (volRange.value / 100); }
volRange.addEventListener("input", () => {
  if (audioG) audioG.master.gain.setTargetAtTime(bgmVol(), audioG.ctx.currentTime, 0.08);
});

let ctx2d = null;
function draw(fa, fb, mixv, isGap, view) {
  view = view || curView;
  if (useGL && gl) {
    const keep = [fa.t, fb.t];
    const texA = ensureFrameTex(fa, keep);
    const texB = ensureFrameTex(fb, keep);
    if (!texA || !texB) return false;
    const motion = wantMotion() && canFlow && !isGap;
    if (motion) computeFlow(texA, texB, `${fa.t}_${fb.t}`);

    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.useProgram(progGlobe);
    gl.bindVertexArray(quadVAO);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texA);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, texB);
    gl.activeTexture(gl.TEXTURE2);
    gl.bindTexture(gl.TEXTURE_2D, motion && flowResult ? flowResult : zeroFlowTex);
    gl.uniform1i(locGlobe.uTexA, 0);
    gl.uniform1i(locGlobe.uTexB, 1);
    gl.uniform1i(locGlobe.uFlow, 2);
    const w = canvas.width, h = canvas.height;
    const rPx = 0.47 * Math.min(w, h);
    gl.uniform2f(locGlobe.uScale, w / 2 / rPx, h / 2 / rPx);
    gl.uniform3f(locGlobe.uView, view.cx, view.cy, view.z);
    gl.uniform2f(locGlobe.uRoll, Math.cos(rollAngle), Math.sin(rollAngle));
    gl.uniform1f(locGlobe.uPx, 1 / (rPx * view.z));
    gl.uniform1f(locGlobe.uMix, mixv);
    gl.uniform1f(locGlobe.uFlowOn, motion && flowResult ? 1 : 0);
    gl.uniform1f(locGlobe.uFix, colorFixActive() ? 1 : 0);
    gl.uniform1f(locGlobe.uConfRelax, sat().flowScale || 1);
    const tint = sat().tint || [1, 1, 1];
    gl.uniform3f(locGlobe.uTint, tint[0], tint[1], tint[2]);
    gl.uniform1f(locGlobe.uTexel, 1 / activeSize);
    gl.uniform1f(locGlobe.uSharp, 0.45);  // アンシャープマスク強度 (少し)
    gl.uniform1f(locGlobe.uScanLon, scanLon);
    gl.uniform1f(locGlobe.uScanShow, bgmOn && scanShow ? 1 : 0);
    // トワイライト再構成用の太陽方向 (フレームA/B時刻 + 補間時刻)
    const tw = layerTw();
    const nm = layerNm();
    gl.uniform1f(locGlobe.uTw, tw ? 1 : 0);
    gl.uniform1f(locGlobe.uNm, nm ? 1 : 0);
    gl.uniform1f(locGlobe.uSrcMerc, layerSrc() === "jma" ? 1 : 0);
    // 星空背景: 衛星経度 + 表示中の補間時刻の恒星時から天球の向きを決める
    gl.uniform1f(locGlobe.uStars, starsOn ? 1 : 0);
    gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, starTex);
    gl.uniform1i(locGlobe.uStarTex, 3);
    if (starsOn) {
      const th = gmstRad(fa.t + (fb.t - fa.t) * mixv) + sat().lon * Math.PI / 180;
      gl.uniform1f(locGlobe.uCosT, Math.cos(th));
      gl.uniform1f(locGlobe.uSinT, Math.sin(th));
      const skyTan = (viewSel && viewSel.value === "manual") ? skyTanFor(view.z)
                   : (SKY_TAN[viewSel ? viewSel.value : "auto"] || 0.30);
      gl.uniform1f(locGlobe.uSkyTan, skyTan);
      gl.uniform1f(locGlobe.uAspect, w / h);
      // 点像を可能な限り小さく (約1px以下)。輝点の大小ではなく輝度で光度差を表現する
      gl.uniform1f(locGlobe.uStarK, Math.pow(h / (2 * skyTan), 2) * 3.6);  // 芯を極小に
      gl.uniform1f(locGlobe.uStarGain, 0.5);   // 明るい星の芯が肥大しないよう控えめ
    }
    if (tw || nm) {
      const sA = sunDirAt(fa.t), sB = sunDirAt(fb.t);
      const sI = sunDirAt(fa.t + (fb.t - fa.t) * mixv);
      gl.uniform3f(locGlobe.uSunA, sA[0], sA[1], sA[2]);
      gl.uniform3f(locGlobe.uSunB, sB[0], sB[1], sB[2]);
      gl.uniform3f(locGlobe.uSunI, sI[0], sI[1], sI[2]);
    }
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    pruneBitmaps(fa.t);
    return true;
  }
  // 2Dフォールバック (クロスフェードのみ)
  if (!ctx2d) ctx2d = canvas.getContext("2d");
  if (!ctx2d) return false;
  const iA = fa.img, iB = fb.img;
  if (!iA || !iA.complete || !iB || !iB.complete) return false;
  const w = canvas.width, h = canvas.height;
  const s = Math.min(w, h) * 0.94 * view.z;
  const x = (w - s) / 2 - view.cx * (s / 2);
  const y = (h - s) / 2 + view.cy * (s / 2);
  ctx2d.filter = "none";
  ctx2d.fillStyle = "#000";
  ctx2d.fillRect(0, 0, w, h);
  ctx2d.save();
  ctx2d.translate(w / 2, h / 2); ctx2d.rotate(rollAngle); ctx2d.translate(-w / 2, -h / 2);  // 画面中心を軸に回転
  // 簡易の色調整 (青み + コントラスト)
  ctx2d.filter = "contrast(115%) saturate(105%) hue-rotate(-4deg)";
  ctx2d.globalAlpha = 1;
  ctx2d.drawImage(iA, x, y, s, s);
  ctx2d.globalAlpha = mixv;
  ctx2d.drawImage(iB, x, y, s, s);
  ctx2d.globalAlpha = 1;
  ctx2d.filter = "none";
  ctx2d.restore();
  return true;
}

// WebGLのcontext取得後に失敗した場合、2D用にcanvasを作り直す
function replaceCanvas() {
  const fresh = document.createElement("canvas");
  fresh.id = "view";
  canvas.parentNode.replaceChild(fresh, canvas);
  canvas = fresh;
  bindCanvas();
}

function decideRenderMode() {
  if (useGL && gl) return; // 球体表示で動作中はそのまま
  if (corsOk) {
    // 2D表示に使っていたcanvasはWebGLを取得できないため作り直す
    if (ctx2d) { replaceCanvas(); ctx2d = null; }
    const r = initGL();
    if (r === "ok") { useGL = true; }
    else { useGL = false; if (r === "fail") replaceCanvas(); }
  } else {
    useGL = false;
  }
  resize();
}

// WebGLコンテキスト喪失 (GPUリセット等) からの自動復旧
function attachContextLossHandlers() {
  canvas.addEventListener("webglcontextlost", (e) => { e.preventDefault(); }, false);
  canvas.addEventListener("webglcontextrestored", () => {
    gl = null;
    const r = initGL();
    if (r === "ok") {
      useGL = true;
      flowTexKey = ""; flowResult = null;
      resize();
    } else {
      // 復旧できない場合は2D表示に退避 (四角表示ではなくリロードで球体復帰も可)
      useGL = false;
      replaceCanvas();
      resize();
    }
  }, false);
}

// ---------------- 再生ループ ----------------
function tick(now) {
  requestAnimationFrame(tick);
  const dt = lastRAF ? Math.min(now - lastRAF, 100) : 0;
  lastRAF = now;
  const ready = readyFrames();
  if (ready.length < 2) return;

  // 連続したフレーム間だけを一定レート (pairMs) で再生する。
  // 欠落区間は尺ゼロ = 再生ヘッドが瞬時に飛び越え、映像はカットでつながる。
  // ホールドは置かず、同じ時刻のフレームで停止することは無い。
  // 回転: 目標角速度へ滑らかに加減速し、角度を進める
  // 実経過時間 (描画フレームが疎でも回転・パン・ズームの補間が実時間どおりに進む)
  const dtr = Math.min(rollLast ? now - rollLast : 0, 1000); rollLast = now;
  {
    const target = rollOn ? ROLL_SPEED * rollDir : 0;
    rollSpeed += (target - rollSpeed) * (1 - Math.exp(-dtr / ROLL_TAU));
    if (!rollOn && Math.abs(rollSpeed) < ROLL_SPEED * 0.01) rollSpeed = 0;   // 停止時は確実にゼロへ
    rollAngle = (rollAngle + rollSpeed * dtr) % (2 * Math.PI);
  }
  // 手動ズーム: 目標値へ指数的に滑らかに追従 (ホイールの段差を吸収)
  if (zoomTarget !== null && viewSel && viewSel.value === "manual") {
    const k = 1 - Math.exp(-dtr / 90);
    const nz = curView.z + (zoomTarget - curView.z) * k;
    let ncx = curView.cx, ncy = curView.cy;
    if (panTarget) {
      ncx += (panTarget.cx - ncx) * k; ncy += (panTarget.cy - ncy) * k;
      if (Math.abs(ncx - panTarget.cx) < 1e-4) ncx = panTarget.cx;
      if (Math.abs(ncy - panTarget.cy) < 1e-4) ncy = panTarget.cy;
    }
    curView = { cx: ncx, cy: ncy, z: Math.abs(nz - zoomTarget) < 1e-4 ? zoomTarget : nz };
  }
  const P = pairMs(), step = stepMs();
  const durs = new Array(ready.length - 1);
  let total = 0;
  for (let i = 0; i < ready.length - 1; i++) {
    const gap = (ready[i + 1].t - ready[i].t) > step * 1.5;
    durs[i] = gap ? 0 : P;
    total += durs[i];
  }
  if (total <= 0) { durs.fill(P); total = durs.length * P; } // 全区間が欠落跨ぎの場合の保険
  playTotal = total;
  let wrapped = false;
  if (playing && !scrubbing) {
    const prev = playPos;
    playPos = (playPos + dt) % total;
    if (playPos < prev - 1) wrapped = true; // ループ先頭へ戻った
  }
  if (playPos >= total) playPos = playPos % total;

  let acc = 0, k = durs.length - 1;
  for (let i = 0; i < durs.length; i++) {
    if (durs[i] > 0 && playPos < acc + durs[i]) { k = i; break; }
    acc += durs[i];
  }
  const frac = durs[k] > 0 ? Math.max(0, Math.min(1, (playPos - acc) / durs[k])) : 1;
  const fa = ready[k], fb = ready[k + 1];
  curFa = fa; // BGM解析用
  curDispT = fa.t + (fb.t - fa.t) * ((fb.t - fa.t) > step * 1.5 ? 1 : frac); // 正午同期スキャン用
  // 正午同期スキャンは映像と同じ60fpsで滑らかに追従させる
  if (bgmOn && dirSel.value === "noon") scanLon = noonRelLon(curDispT);
  // 欠落を跨ぐ区間 (通常は尺ゼロで通過しない。末尾などで残る場合はフェードせず後フレームを即表示)
  const isGap = (fb.t - fa.t) > step * 1.5;
  const mixv = isGap ? 1 : frac;
  const shownTNow = isGap ? fb.t : (frac < 0.5 ? fa.t : fb.t);

  // ジャンプ検出: ラップ、または表示時刻が前方へ飛んだ (=欠落を跨いだ) 瞬間。
  // カットではなく、直前の画面をスナップショットしてクロスフェードで滑らかにつなぐ
  // (地球も背景も一緒に溶暗・溶明する)。スワイプシーク中はフェードしない
  if (playing && !scrubbing) {
    const jumped = lastShownT !== null && shownTNow - lastShownT > step * 1.5;
    if ((wrapped || jumped) && now - lastCutAt > MIN_CUT_INTERVAL) {
      if (useGL && gl && snapTex) {
        // 現在キャンバスに残る「ジャンプ前の画面」をスナップショットに複製
        gl.bindTexture(gl.TEXTURE_2D, snapTex);
        gl.copyTexImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 0, 0, canvas.width, canvas.height, 0);
        fadeActive = true; fadeAlpha = 1;
      }
      cutSwitchView();          // 画角の切替もフェードで隠れる
      lastCutAt = now;
    }
  }
  lastShownT = shownTNow;

  if (draw(fa, fb, mixv, isGap)) {
    // フェード中: 凍結したジャンプ前の画面を、新しい映像の上に薄れながら重ねる
    if (fadeActive && useGL && gl && progComp) {
      gl.useProgram(progComp);
      gl.bindVertexArray(quadVAO);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, snapTex);
      gl.uniform1i(locComp.uTex, 0);
      gl.uniform1f(locComp.uAlpha, Math.max(0, fadeAlpha));
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      gl.disable(gl.BLEND);
      fadeAlpha -= dt / FADE_MS;
      if (fadeAlpha <= 0) { fadeActive = false; fadeAlpha = 0; }
    }
    const shownT = shownTNow;
    const key = `${shownT}`;
    if (key !== shownPairKey) {
      shownPairKey = key;
      const { jst, utc } = fmtJST(shownT);
      elTime.innerHTML = `${jst} JST<span class="utc">${utc} UTC</span>`;
    }
    elProg.style.width = `${(playPos / total) * 100}%`;
  }
  // 先読みデコード
  if (useGL) for (let d = 1; d <= 3; d++) { const f = ready[(k + d) % ready.length]; if (f) ensureBitmap(f); }
}

function updateStatus() {
  const ready = readyFrames().length;
  const failed = frames.filter((f) => f.ok === false).length;
  const absent = frames.filter((f) => f.ok === false && f.kind === "absent").length;
  const transient = failed - absent;
  const { jst } = fmtJST(latestT);
  // 分母はサーバーに存在するはずの枚数 (欠落コマは除外して表示)
  let s = `最新画像: ${jst} JST (${fmtAgo(latestT)})　|　${ready}/${frames.length - absent} 枚　|　${activeSize}px`;
  if (absent > 0) s += `　(衛星データ欠落 ${absent}コマ — 定期確認中)`;
  if (transient > 0) s += `　(取得失敗 ${transient}枚 — 自動再試行中)`;
  if (useGL) s += wantMotion() && canFlow ? "　|　モーション補間" : "　|　クロスフェード";
  else s += "　|　簡易表示モード";
  s += `　|　${(sat().layers[layerSel.value] || sat().layers[sat().defaultLayer]).label}`;
  elStatus.textContent = s;
  // 初回ロード中のみ中央にローディング表示。
  // 「全フレームが揃った」または「全フレームを一巡試行し終えた (残りはバックグラウンドで再試行)」
  // 時点で消灯し、その後の定期更新や再試行では二度と再表示しない。
  const expected = frames.length - absent;
  if (!initialLoadDone && frames.length > 0) {
    const pendingFirstTry = frames.some((f) => f.ok === null) || inFlight > 0 || queue.length > 0;
    if (ready >= expected || !pendingFirstTry) initialLoadDone = true;
    // ロード枚数が120枚 (全体がそれ未満の衛星では全枚数) を超えたら再生モードへ
    if (ready >= Math.min(120, expected)) initialLoadDone = true;
    // 停滞判定: 最新側 (現在から約30分前まで) の画像が揃っている状態でロードが
    // 一定時間進まなくなったら、残りはバックグラウンド取得に回して再生モードに入る
    if (!initialLoadDone && ready >= 2 && lastNewFrameAt > 0) {
      const newestLoaded = readyFrames().at(-1).t;
      const nearNow = Date.now() - newestLoaded < NEAR_NOW_MS;
      const stalled = Date.now() - lastNewFrameAt > STALL_MS &&
                      Date.now() - loadStartAt > STALL_MS * 1.5;
      if (nearNow && stalled) initialLoadDone = true;
    }
  }
  if (!initialLoadDone && frames.length > 0) {
    const lyr = sat().layers[layerSel.value] || sat().layers[sat().defaultLayer];
    elLoadTech.textContent =
      `${lyr.tech} · ${Math.round(stepMs() / 60000)}-MIN INTERVAL · ${activeSize} PX · LAST 24 HOURS`;
    elLoadCount.textContent = `${ready} / ${expected}`;
    elLoadFill.style.width = `${Math.round((ready / Math.max(1, expected)) * 100)}%`;
    elLoading.classList.add("visible");
  } else {
    elLoading.classList.remove("visible");
  }
  applyUiAutoHide();
  updateMemInfo();
  if (ready >= 2) overlay.classList.add("hidden");
  else if (ready === 0 && failed >= frames.length && frames.length > 0) {
    showError("画像を取得できませんでした。",
      "ネットワーク接続をご確認ください。プロキシ環境では view.eumetsat.int への接続が必要です。このまま自動的に再試行を続けます。",
      true);
  }
}
// 使用メモリの目安 (画像データ + デコード済みビットマップ + GPUテクスチャ + 先読みキャッシュ)
function updateMemInfo() {
  let imgBytes = 0;
  for (const f of frames) if (f.blob) imgBytes += f.blob.size;
  let cacheBytes = 0;
  for (const b of urlCache.values()) cacheBytes += b.size;
  let decBytes = 0;
  for (const [, e] of bmCache) if (e.bm) decBytes += e.bm.width * e.bm.height * 4;
  const texBytes = texPool.filter((s) => s.tex).length * activeSize * activeSize * 3;
  const totalMB = (imgBytes + cacheBytes + decBytes + texBytes) / 1048576;
  const heap = (performance.memory && performance.memory.usedJSHeapSize)
    ? ` · JS ${Math.round(performance.memory.usedJSHeapSize / 1048576)} MB` : "";
  elMemInfo.textContent = totalMB > 0.5
    ? `MEM ≈ ${Math.round(totalMB)} MB (画像 ${Math.round((imgBytes + cacheBytes) / 1048576)} · デコード ${Math.round(decBytes / 1048576)} · GPU ${Math.round(texBytes / 1048576)}${heap})`
    : "";
}

function showError(msg, msg2, keepSpinner) {
  overlay.classList.remove("hidden");
  overlay.querySelector(".spinner").style.display = keepSpinner ? "" : "none";
  ovMsg.textContent = msg;
  ovMsg2.textContent = msg2 || "";
}

// ---------------- 起動・設定変更 ----------------
let connectRetryTimer = null;
function scheduleConnectRetry(session) {
  clearTimeout(connectRetryTimer);
  connectRetryTimer = setTimeout(() => {
    if (session === SESSION) start();
  }, CONNECT_RETRY_MS);
}

async function start() {
  const session = ++SESSION;
  clearTimeout(connectRetryTimer);
  playPos = 0; shownPairKey = "";
  if (!(viewSel && viewSel.value === "manual")) curView = { ...FULL_VIEW }; // 手動ズームは保持
  lastZoomIdx = -1;
  lastShownT = null; lastCutAt = 0;
  scrubbing = false; ptr = null;
  initialLoadDone = false;
  // 前の衛星のフレームをすぐに破棄する。残したままだと5秒間隔のupdateStatusが
  // 旧データの枚数で「ロード完了」と誤判定し、切替時のローディング表示が出ない。
  frames = []; latestT = 0;
  elLoading.classList.add("visible"); elLoadCount.textContent = ""; elLoadFill.style.width = "0%";
  flowTexKey = ""; flowResult = null;
  for (const s of texPool) s.key = 0;
  for (const [, e] of bmCache) if (e.bm) e.bm.close();
  bmCache.clear();
  queue.length = 0;
  overlay.classList.remove("hidden");
  overlay.querySelector(".spinner").style.display = "";
  ovMsg.textContent = "CONNECTING TO EUMETSAT…";
  ovMsg2.textContent = "";

  // 気象庁カラー (JMAタイル) はクロスオリジン取得が許可されていない環境では
  // ブラウザから読み込めない。開始時に1タイルを実fetchで検査し、失敗したら
  // 自動的にGIBSの白黒可視レイヤーへ切り替えて必ず表示できるようにする
  if (layerSrc() === "jma") {
    ovMsg.textContent = "CONNECTING TO JMA HIMAWARI…";
    // 検査するのは「クロスオリジン取得が可能か」だけ。応答が返れば (404でも) CORSは
    // 通っている = カラー取得可能。fetchが例外になる場合のみCORSブロックと判断する
    let jmaOk = false;
    try {
      const tProbe = Math.floor((Date.now() - MIN_LAG_MS) / stepMs()) * stepMs();
      const rr = await fetch(probeUrlFor(satSel.value, layerId(), tProbe, 256), { signal: AbortSignal.timeout(12000) });
      try { await rr.blob(); } catch (e) {}
      jmaOk = true;  // 例外なく応答 = CORS通過
    } catch (e) { jmaOk = false; }
    if (session !== SESSION) return;
    if (!jmaOk && SATS[satSel.value].layers.vis) {
      layerSel.value = "vis";   // カラー取得不可 → 可視(白黒)にフォールバック
      updateStatus();
    }
  }

  let latest = null;
  try {
    latest = await latestFromCaps(session);
    corsOk = true;
  } catch (e) {
    if (session !== SESSION) return;
    corsOk = false;
  }
  if (session !== SESSION) return;

  try {
    if (corsOk) {
      const cap = floorSlot(Date.now() - MIN_LAG_MS);
      let probe = latest + stepMs();
      while (probe <= cap && (await probeImage(probe, session))) { latest = probe; probe += stepMs(); }
    } else {
      ovMsg.textContent = "SEARCHING FOR LATEST IMAGERY…";
      latest = await latestByProbe(session);
      // capsの取得は失敗したが、画像そのものがCORS対応なら球体表示 (WebGL) は可能。
      // ここを確認しないと、一時的なcaps失敗だけで平面表示 (四角い地球) に固定されてしまう。
      corsOk = await new Promise((resolve) => {
        const im = new Image();
        im.crossOrigin = "anonymous";
        im.onload = () => resolve(true);
        im.onerror = () => resolve(false);
        im.src = wmsUrl(latest, 128) + `&_=${Date.now()}`;
        setTimeout(() => resolve(false), 15000);
      });
      if (session !== SESSION) return;
    }
  } catch (e) {
    if (session !== SESSION) return;
    showError("EUMETSAT のサービスに接続できませんでした。",
      "ネットワーク接続をご確認ください。30秒後に自動的に再接続します。", true);
    scheduleConnectRetry(session);
    return;
  }
  if (session !== SESSION) return;

  decideRenderMode();

  // 希望画質をサーバーが受けるか確認 (だめなら自動で下げる)。一度確認したサイズは再確認しない
  if (sizeVerified.has(imgSize())) {
    activeSize = imgSize();
  } else {
    ovMsg.textContent = "CHECKING IMAGE QUALITY…";
    try {
      activeSize = await pickWorkingSize(latest, session);
      if (activeSize === imgSize()) sizeVerified.add(activeSize);
    } catch (e) { if (session !== SESSION) return; activeSize = 1024; }
  }
  if (session !== SESSION) return;

  ovMsg.textContent = "LOADING SATELLITE IMAGERY…";
  ovMsg2.textContent = `直近24時間 (${nFrames()}枚 / ${activeSize}px) を新しい順に取得します。再生は数枚そろい次第始まります。`;
  loadStartAt = Date.now();
  lastNewFrameAt = 0;
  buildTimeline(latest);
  enqueueAll(session);
  updateStatus();
}

satSel.addEventListener("change", () => { rebuildLayerOptions(); start(); });
layerSel.addEventListener("change", start);
speedSel.addEventListener("change", updateStatus);
interpSel.addEventListener("change", updateStatus);
viewSel.addEventListener("change", applyViewMode);
fixChk.addEventListener("change", updateStatus);
fsBtn.addEventListener("click", () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
});
function togglePlay() {
  playing = !playing;
  elPaused.style.display = playing ? "none" : "flex";
  playBtn.textContent = playing ? "⏸ 一時停止" : "▶ 再生";
}
playBtn.addEventListener("click", togglePlay);
bgmBtn.addEventListener("click", toggleBgm);
scanBtn.addEventListener("click", () => {
  scanShow = !scanShow;
  scanBtn.textContent = scanShow ? "スキャン線: ON" : "スキャン線: OFF";
});
starsBtn.addEventListener("click", () => {
  starsOn = !starsOn;
  starsBtn.textContent = starsOn ? "星空: ON" : "星空: OFF";
});
{
  const rb = document.getElementById("rollBtn");
  rb.addEventListener("pointerdown", (e) => { e.preventDefault(); try { rb.setPointerCapture(e.pointerId); } catch (_) {} setRolling(true, e.shiftKey); });
  const stop = () => setRolling(false);
  rb.addEventListener("pointerup", stop);
  rb.addEventListener("pointercancel", stop);
  rb.addEventListener("lostpointercapture", stop);
  rb.addEventListener("contextmenu", (e) => e.preventDefault());   // 長押しメニューを抑止 (タッチ)
}
window.addEventListener("blur", () => setRolling(false));           // フォーカスを失ったら必ず停止

// --- UIの表示制御 ---
// ロード完了後は日時 (と映像) 以外のすべての表示を隠し、タップしたときだけ5秒間表示する。
// ロード中はHUD・ステータス等を表示したまま (コントロールメニューは常にタップ時のみ)。
let uiTimer = null, uiVisible = false;
function applyUiAutoHide() {
  document.body.classList.toggle("hideui", initialLoadDone && !uiVisible);
}
function showUI() {
  uiVisible = true;
  controls.classList.add("visible");
  applyUiAutoHide();
  clearTimeout(uiTimer);
  uiTimer = setTimeout(hideUI, 5000);
}
function hideUI() {
  uiVisible = false;
  controls.classList.remove("visible");
  clearTimeout(uiTimer);
  applyUiAutoHide();
}
// メニュー操作中は隠れないように延長
controls.addEventListener("pointerdown", showUI);
controls.addEventListener("change", showUI);

// --- タップ判定 & 左右スワイプで早送り/巻き戻し ---
function bindCanvas() {
  // ドラッグ = 地球の表示位置を移動 (パン)。早送り/巻き戻しは画面下端の帯 (SEEK_STRIP px)
  // でのドラッグ、または Shift+ドラッグ。タップは UI の表示/非表示。
  const SEEK_STRIP = 36;
  canvas.addEventListener("pointerdown", (e) => {
    const seekZone = e.shiftKey || (canvas.clientHeight - e.clientY) <= SEEK_STRIP;
    ptr = { id: e.pointerId, x0: e.clientX, y0: e.clientY, lx: e.clientX, ly: e.clientY,
            t0: performance.now(), pos0: playPos, moved: false, mode: seekZone ? "seek" : "pan" };
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  });
  canvas.addEventListener("pointermove", (e) => {
    if (!ptr || e.pointerId !== ptr.id) return;
    const dx = e.clientX - ptr.x0, dy = e.clientY - ptr.y0;
    if (!ptr.moved && Math.hypot(dx, dy) > 6) {
      ptr.moved = true;
      if (ptr.mode === "seek") scrubbing = true;
      else canvas.style.cursor = "grabbing";
    }
    if (!ptr.moved) return;
    if (ptr.mode === "seek") {
      if (playTotal > 0) {
        // 画面幅いっぱいのドラッグ = ループ全体 (右で早送り / 左で巻き戻し)
        const delta = (dx / Math.max(1, canvas.clientWidth)) * playTotal;
        playPos = (((ptr.pos0 + delta) % playTotal) + playTotal) % playTotal;
      }
    } else {
      panBy(e.clientX - ptr.lx, e.clientY - ptr.ly);   // 直前位置からの差分で移動
      ptr.lx = e.clientX; ptr.ly = e.clientY;
    }
  });
  // タップ: UI の表示/非表示 (ダブルタップと区別するため少し待ってから実行)
  // ダブルクリック / ダブルタップ: 地球の表示位置を画面中心へ戻す (拡大率は維持)
  const DBL_MS = 320, DBL_DIST = 30;
  let lastTap = null, tapTimer = null;
  const endPtr = (e) => {
    if (!ptr || e.pointerId !== ptr.id) return;
    const wasTap = !ptr.moved && performance.now() - ptr.t0 < 500;
    scrubbing = false;
    canvas.style.cursor = "";
    ptr = null;
    if (!wasTap) return;
    // 判定時刻は入力イベント自体の時刻 (処理が重くハンドラが遅れても正しく判定できる)
    const now = e.timeStamp || performance.now();
    if (lastTap && now - lastTap.t < DBL_MS && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < DBL_DIST) {
      clearTimeout(tapTimer); tapTimer = null; lastTap = null;
      recenterView();
      return;
    }
    lastTap = { t: now, x: e.clientX, y: e.clientY };
    clearTimeout(tapTimer);
    tapTimer = setTimeout(() => { tapTimer = null; if (uiVisible) hideUI(); else showUI(); }, DBL_MS);
  };
  canvas.addEventListener("pointerup", endPtr);
  canvas.addEventListener("pointercancel", endPtr);

  // --- スクロール (ホイール / トラックパッド) で地球の大きさを自由に変更 ---
  canvas.addEventListener("wheel", (e) => {
    e.preventDefault();
    let dy = e.deltaY;
    if (e.deltaMode === 1) dy *= 16; else if (e.deltaMode === 2) dy *= 400;  // 行/ページ単位を画素相当へ
    // トラックパッドのピンチは ctrlKey 付きの wheel として届く → 強めに反応
    const gain = e.ctrlKey ? 0.012 : 0.0018;
    const base = zoomTarget ?? curView.z;
    setManualZoom(base * Math.exp(-dy * gain), e.clientX, e.clientY);   // 上スクロール/ピンチアウト = カーソル位置を中心に拡大
    showUI();
  }, { passive: false });

  // --- タッチ: 2本指ピンチで拡大縮小 (1本指は従来どおりスワイプシーク) ---
  const touches = new Map();
  let pinch = null;   // {d0, z0}
  const dist = () => { const a = [...touches.values()]; return Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y); };
  canvas.addEventListener("pointerdown", (e) => {
    if (e.pointerType !== "touch") return;
    touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (touches.size === 2) {
      const a = [...touches.values()];
      pinch = { d0: Math.max(1, dist()), z0: zoomTarget ?? curView.z,
                mx: (a[0].x + a[1].x) / 2, my: (a[0].y + a[1].y) / 2 };
      scrubbing = false; ptr = null; canvas.style.cursor = "";   // 1本指操作は中断してピンチへ
    }
  });
  canvas.addEventListener("pointermove", (e) => {
    if (!touches.has(e.pointerId)) return;
    touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinch && touches.size === 2) {
      const a = [...touches.values()];
      const mx = (a[0].x + a[1].x) / 2, my = (a[0].y + a[1].y) / 2;
      panBy(mx - pinch.mx, my - pinch.my);            // 2本指の中点の移動 = パン
      pinch.mx = mx; pinch.my = my;
      setManualZoom(pinch.z0 * dist() / pinch.d0, mx, my);   // 中点を基準に拡大縮小
    }
  });
  const endTouch = (e) => { touches.delete(e.pointerId); if (touches.size < 2) pinch = null; };
  canvas.addEventListener("pointerup", endTouch);
  canvas.addEventListener("pointercancel", endTouch);
}
bindCanvas();
document.addEventListener("keyup", (e) => {
  if (e.key === "r" || e.key === "R") setRolling(false);   // R を離したら停止
});
document.addEventListener("keydown", (e) => {
  if (e.target && /^(INPUT|SELECT|TEXTAREA|BUTTON)$/.test(e.target.tagName)) return;  // 操作部品のフォーカス中は無効
  if (e.code === "Space") { e.preventDefault(); togglePlay(); }
  // + / - キーでも拡大縮小
  if (e.key === "+" || e.key === "=" ) { setManualZoom((zoomTarget ?? curView.z) * 1.15); showUI(); }
  if (e.key === "-" || e.key === "_" ) { setManualZoom((zoomTarget ?? curView.z) / 1.15); showUI(); }
  if (e.key === "Home" || e.key === "0") recenterView();   // Home / 0 キーでも中心へ
  // R: 押している間だけ高速回転 (Shift+R: 逆回転)。キーリピートは無視し、keyup で停止
  if ((e.key === "r" || e.key === "R") && !e.repeat) { setRolling(true, e.shiftKey); showUI(); }
  // ←/→ キーで1コマ (10分) ずつ巻き戻し/早送り
  if ((e.key === "ArrowLeft" || e.key === "ArrowRight") && playTotal > 0) {
    e.preventDefault();
    const d = (e.key === "ArrowRight" ? 1 : -1) * pairMs();
    playPos = (((playPos + d) % playTotal) + playTotal) % playTotal;
  }
});

setInterval(() => { refreshLatest(SESSION); }, REFRESH_MS);
setInterval(retrySweep, RETRY_SWEEP_MS);
setInterval(updateStatus, 5000); // 停滞判定・表示更新 (バックグラウンド取得は4分毎+自動再試行で継続)

rebuildLayerOptions();
resize();
requestAnimationFrame(tick);
start();
</script>
