  playPos = 0; shownPairKey = "";
  curView = { ...FULL_VIEW }; lastZoomIdx = -1;
  lastShownT = null; lastCutAt = 0;
  scrubbing = false; ptr = null;
  initialLoadDone = false;
  // 前の衛星のフレームをすぐに破棄する。残したままだと5秒間隔のupdateStatusが
  // 旧データの枚数で「ロード完了」と誤判定し、切替時のローディング表示が出ない。
  frames = []; latestT = 0;
  elLoading.classList.add("visible"); elLoadCount.textContent = ""; elLoadFill.style.width = "0%";
  flowTexKey = ""; flowResult = null;
  for (const s of texPool) s.key = 0;
  for (const [, e] of bmCache) if (e.bm) e.bm.close();
  bmCache.clear();
  queue.length = 0;
  overlay.classList.remove("hidden");
  overlay.querySelector(".spinner").style.display = "";
  ovMsg.textContent = "CONNECTING TO EUMETSAT…";
  ovMsg2.textContent = "";

  let latest = null;
  try {
    latest = await latestFromCaps(session);
    corsOk = true;
  } catch (e) {
    if (session !== SESSION) return;
    corsOk = false;
  }
  if (session !== SESSION) return;

  try {
    if (corsOk) {
      const cap = floorSlot(Date.now() - MIN_LAG_MS);
      let probe = latest + stepMs();
      while (probe <= cap && (await probeImage(probe, session))) { latest = probe; probe += stepMs(); }
    } else {
      ovMsg.textContent = "SEARCHING FOR LATEST IMAGERY…";
      latest = await latestByProbe(session);
      // capsの取得は失敗したが、画像そのものがCORS対応なら球体表示 (WebGL) は可能。
      // ここを確認しないと、一時的なcaps失敗だけで平面表示 (四角い地球) に固定されてしまう。
      corsOk = await new Promise((resolve) => {
        const im = new Image();
        im.crossOrigin = "anonymous";
        im.onload = () => resolve(true);
        im.onerror = () => resolve(false);
        im.src = wmsUrl(latest, 128) + `&_=${Date.now()}`;
        setTimeout(() => resolve(false), 15000);
      });
      if (session !== SESSION) return;
    }
  } catch (e) {
    if (session !== SESSION) return;
    showError("EUMETSAT のサービスに接続できませんでした。",
      "ネットワーク接続をご確認ください。30秒後に自動的に再接続します。", true);
    scheduleConnectRetry(session);
    return;
  }
  if (session !== SESSION) return;

  decideRenderMode();

  // 希望画質をサーバーが受けるか確認 (だめなら自動で下げる)。一度確認したサイズは再確認しない
  if (sizeVerified.has(imgSize())) {
    activeSize = imgSize();
  } else {
    ovMsg.textContent = "CHECKING IMAGE QUALITY…";
    try {
      activeSize = await pickWorkingSize(latest, session);
      if (activeSize === imgSize()) sizeVerified.add(activeSize);
    } catch (e) { if (session !== SESSION) return; activeSize = 1024; }
  }
  if (session !== SESSION) return;

  ovMsg.textContent = "LOADING SATELLITE IMAGERY…";
  ovMsg2.textContent = `直近24時間 (${nFrames()}枚 / ${activeSize}px) を新しい順に取得します。再生は数枚そろい次第始まります。`;
  loadStartAt = Date.now();
  lastNewFrameAt = 0;
  buildTimeline(latest);
  enqueueAll(session);
  updateStatus();
}

satSel.addEventListener("change", () => { rebuildLayerOptions(); start(); });
layerSel.addEventListener("change", start);
speedSel.addEventListener("change", updateStatus);
interpSel.addEventListener("change", updateStatus);
fixChk.addEventListener("change", updateStatus);
fsBtn.addEventListener("click", () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
});
function togglePlay() {
  playing = !playing;
  elPaused.style.display = playing ? "none" : "flex";
  playBtn.textContent = playing ? "⏸ 一時停止" : "▶ 再生";
}
playBtn.addEventListener("click", togglePlay);
bgmBtn.addEventListener("click", toggleBgm);
scanBtn.addEventListener("click", () => {
  scanShow = !scanShow;
  scanBtn.textContent = scanShow ? "スキャン線: ON" : "スキャン線: OFF";
});

// --- UIの表示制御 ---
// ロード完了後は日時 (と映像) 以外のすべての表示を隠し、タップしたときだけ5秒間表示する。
// ロード中はHUD・ステータス等を表示したまま (コントロールメニューは常にタップ時のみ)。
let uiTimer = null, uiVisible = false;
function applyUiAutoHide() {
  document.body.classList.toggle("hideui", initialLoadDone && !uiVisible);
}
function showUI() {
  uiVisible = true;
  controls.classList.add("visible");
  applyUiAutoHide();
  clearTimeout(uiTimer);
  uiTimer = setTimeout(hideUI, 5000);
}
function hideUI() {
  uiVisible = false;
  controls.classList.remove("visible");
  clearTimeout(uiTimer);
  applyUiAutoHide();
}
// メニュー操作中は隠れないように延長
controls.addEventListener("pointerdown", showUI);
controls.addEventListener("change", showUI);

// --- タップ判定 & 左右スワイプで早送り/巻き戻し ---
function bindCanvas() {
  canvas.addEventListener("pointerdown", (e) => {
    ptr = { id: e.pointerId, x0: e.clientX, t0: performance.now(), pos0: playPos, moved: false };
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  });
  canvas.addEventListener("pointermove", (e) => {
    if (!ptr || e.pointerId !== ptr.id) return;
    const dx = e.clientX - ptr.x0;
    if (!ptr.moved && Math.abs(dx) > 8) { ptr.moved = true; scrubbing = true; }
    if (scrubbing && playTotal > 0) {
      // 画面幅いっぱいのスワイプ = ループ全体 (右スワイプで早送り / 左で巻き戻し)
      const delta = (dx / Math.max(1, canvas.clientWidth)) * playTotal;
      playPos = (((ptr.pos0 + delta) % playTotal) + playTotal) % playTotal;
    }
  });
  const endPtr = (e) => {
    if (!ptr || e.pointerId !== ptr.id) return;
    const wasTap = !ptr.moved && performance.now() - ptr.t0 < 500;
    scrubbing = false;
    ptr = null;
    if (wasTap) {
      // タップ: UI (メニュー・ステータス等) の表示/非表示を切り替え
      if (uiVisible) hideUI();
      else showUI();
    }
  };
  canvas.addEventListener("pointerup", endPtr);
  canvas.addEventListener("pointercancel", endPtr);
}
bindCanvas();
document.addEventListener("keydown", (e) => {
  if (e.code === "Space") { e.preventDefault(); togglePlay(); }
});

setInterval(() => { refreshLatest(SESSION); }, REFRESH_MS);
setInterval(retrySweep, RETRY_SWEEP_MS);
setInterval(updateStatus, 5000); // 停滞判定・表示更新 (バックグラウンド取得は4分毎+自動再試行で継続)

rebuildLayerOptions();
resize();
requestAnimationFrame(tick);
start();
</script>
</body>
